function whoRef(kind){ const s=state.profile?.sex; if(s==='m'||s==='f') return WHO[kind][s]; return WHO[kind].m.map((v,i)=>(v+WHO[kind].f[i])/2); }
function growthChart(kind, title, conv, unit){
  const pts=state.entries.filter(e=>e.type==='growth' && e[kind==='w'?'weight':'length']!=null).map(e=>({x:ageDays(state.profile.birth,e.start)/30.4375, y:e[kind==='w'?'weight':'length']})).filter(p=>p.x>=0).sort((a,b)=>a.x-b.x);
  const ref=whoRef(kind);
  const xmax=Math.min(24, Math.max(6, Math.ceil(((pts.at(-1)?.x)||0)+2), Math.ceil(ageDays(state.profile.birth)/30.4375)+1));
  const refPts=ref.slice(0,xmax+1).map((y,x)=>({x,y}));
  const ys=[...pts.map(p=>p.y),...refPts.map(p=>p.y)].map(conv);
  let ymin=Math.floor(Math.min(...ys)*0.92), ymax=Math.ceil(Math.max(...ys)*1.05);
  const W=640,H=240,L=44,R=12,Tp=12,B=28;
  const X=x=>L+(W-L-R)*x/xmax, Y=y=>Tp+(H-Tp-B)*(1-(conv(y)-ymin)/(ymax-ymin));
  let g='';
  for(let k=0;k<=4;k++){ const v=ymin+(ymax-ymin)*k/4, y=Tp+(H-Tp-B)*(1-k/4); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`; }
  const step=xmax<=12?2:4; for(let m=0;m<=xmax;m+=step) g+=`<text x="${X(m)}" y="${H-8}" text-anchor="middle">${m} mo</text>`;
  g+=`<polyline fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4" points="${refPts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ')}"/>`;
  if(pts.length){ g+=`<polyline fill="none" stroke="var(--growth)" stroke-width="2.5" points="${pts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ')}"/>`;
    pts.forEach((p,i)=>g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===pts.length-1?5:3.5}" fill="var(--growth)" stroke="var(--surface)" stroke-width="1.5"><title>${p.x.toFixed(1)} mo: ${conv(p.y).toFixed(1)} ${unit}</title></circle>`); }
  return `<div class="panel"><h2><span>${title} (${unit})</span></h2><div class="legend" style="margin-bottom:6px"><span><i style="background:var(--growth)"></i>${esc(state.profile.name)}</span><span><i style="background:var(--ink-3)"></i>WHO median</span></div><div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} chart">${g}</svg></div>${pts.length?'':'<p class="empty">Add a measurement to start the chart.</p>'}</div>`;
}
function vGrowth(){
  let h='';
  const gs=state.entries.filter(e=>e.type==='growth');
  h+=`<div class="head" style="align-items:center"><h2 style="font-size:21px">Growth</h2><button class="btn primary" data-new="growth" ${state.canWrite?'':'disabled'}>${svg('plus','width="16" height="16"')} Add measurement</button></div>`;
  h+=`<div class="grid2">${growthChart('w','Weight',U.imp()?v=>v*2.20462:v=>v,U.wtU())}${growthChart('l','Height',U.imp()?v=>v/2.54:v=>v,U.lenU())}</div>`;
  h+=`<div class="panel"><h2>Measurements</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Age</th><th>Weight</th><th>Height</th><th>Head</th>${gs.some(e=>e.belly!=null)?'<th>Belly</th>':''}</tr></thead><tbody>${gs.map(e=>`<tr data-edit="${e.id}" style="cursor:pointer"><td>${new Date(e.start).toLocaleDateString()}</td><td>${esc(ageText(state.profile.birth,e.start))}</td><td>${U.wt(e.weight)||'—'}</td><td>${U.len(e.length)||'—'}</td><td>${U.len(e.head)||'—'}</td>${gs.some(x=>x.belly!=null)?`<td>${U.len(e.belly)||'—'}</td>`:''}</tr>`).join('')||'<tr><td colspan="5" class="empty">No measurements yet.</td></tr>'}</tbody></table></div>

const TEETH=[ // id, label, arch, index 0..4 from center, typical months
  ['uci','Central incisor','u',0,'8–12'],['uli','Lateral incisor','u',1,'9–13'],['uc','Canine','u',2,'16–22'],['um1','First molar','u',3,'13–19'],['um2','Second molar','u',4,'25–33'],
  ['lci','Central incisor','l',0,'6–10'],['lli','Lateral incisor','l',1,'10–16'],['lc','Canine','l',2,'17–23'],['lm1','First molar','l',3,'14–18'],['lm2','Second molar','l',4,'23–31']
];
function mouthSvg(){
  const cx=170, ucy=150, lcy=170; let g='';
  TEETH.forEach(([id,label,arch,i])=>{
    ['l','r'].forEach(side=>{
      const key=`${id}_${side}`, on=!!state.teeth[key];
      const ang=(i*17+9)*Math.PI/180*(side==='l'?-1:1);
      const rx=120, ry=110, x=cx+Math.sin(ang)*rx, y= arch==='u' ? ucy-Math.cos(ang)*ry : lcy+Math.cos(ang)*ry;
      const s=i>=3?15:i===2?11:10;
      const rot=ang*180/Math.PI*(arch==='u'?1:-1);
      g+=`<g class="tooth ${on?'on':''}" data-tooth="${key}" tabindex="0" role="button" aria-label="${arch==='u'?'Upper':'Lower'} ${side==='l'?'left':'right'} ${label}${on?', erupted':''}" transform="translate(${x} ${y}) rotate(${rot})"><path d="M${-s} ${-s*0.8} q${s} ${-s*0.5} ${2*s} 0 v${s*1.4} q${-s} ${s*0.5} ${-2*s} 0z"/></g>`;
    });
  });
  g+=`<text x="${cx}" y="${ucy-20}" text-anchor="middle">UPPER</text><text x="${cx}" y="${lcy+30}" text-anchor="middle">LOWER</text>`;
  return `<svg class="mouth" viewBox="0 0 340 300" aria-label="Teeth chart">${g}</svg>`;
}
const NEWBORN=[['vitk','Vitamin K shot','At birth'],['eyes','Eye ointment','At birth'],['hepb','Hepatitis B, dose 1','Within 24 hours'],['cchd','Heart screening (pulse oximetry)','After 24 hours'],['screen','Newborn blood screening (heel prick)','24–48 hours'],['hearing','Hearing screening','Before leaving the hospital'],['birthwt','Back to birth weight','By about 2 weeks'],['cord','Umbilical cord stump fell off','Usually 1–3 weeks']];
function newbornAuto(k){
  const p=state.profile||{}, born=p.birth?new Date(p.birth+'T00:00').getTime():null;
  if(k==='hepb'){ const v=state.entries.find(e=>e.type==='vaccine'&&/hep/i.test(e.name||'')); return v?dayKey(v.start):null; }
  if(k==='visit1'&&born){ const v=state.entries.filter(e=>e.type==='doctor'&&e.start<=Date.now()&&e.start-born<14*DAY).sort((a,b)=>a.start-b.start)[0]; return v?dayKey(v.start):null; }
  if(k==='birthwt'){ const g=state.entries.filter(e=>e.type==='growth'&&e.weight!=null&&e.start<=Date.now()).sort((a,b)=>a.start-b.start); if(g.length<2) return null; const bw=g[0].weight, b=g.slice(1).find(e=>e.weight>=bw && e.start-g[0].start>2*DAY); return b?dayKey(b.start):null; }
  return null;
}
function newbornPanel(){

/* ---------- names (who logged) ---------- */
function resolveNames(){
  if(state.mode!=='cloud') return;
  if(members.length<2) return;
  document.querySelectorAll('[data-by]').forEach(el=>{ const id=el.dataset.by; if(!id) return; el.textContent = id===uid() ? '' : (members.find(m=>m.user_id===id)?.display_name||''); });
}

/* ---------- install as an app ---------- */
let installEvt=null;
const isStandalone = () => { try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(e){ return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; if(state.view==='settings') softRender(); });
window.addEventListener('appinstalled', ()=>{ installEvt=null; toast('Bebenou is on your home screen'); softRender(); });
function installPanel(){
  if(NATIVE) return '';
  if(isStandalone()) return `<div class="panel"><h2>App</h2><p>Bebenou is installed on this device. Open it from your home screen.</p></div>`;
  const body = installEvt
    ? `<p>Add Bebenou to your home screen so it opens full screen, like an app.</p><button class="btn primary" data-act="install">Install app</button>`
    : isIOS()
    ? `<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>⋯</b> button next to the address bar, then <b>Share</b>. On older iPhones, tap the Share button at the bottom.</li><li>Tap <b>Add to Home Screen</b>, keep <b>Open as Web App</b> on, and tap <b>Add</b>.</li></ol>`
    : `<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>In <b>Chrome</b>, tap the <b>⋮</b> menu.</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li></ol><p class="note">On a computer, use the install icon at the right end of the address bar.</p>`;
  return `<div class="panel"><h2>Add to home screen</h2>${body}</div>`;
}

  if(state.mode!=='cloud') return `<div class="panel"><h2>Family sharing</h2><p>Add your baby to start a log, or join one with an invite code.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="setup">Add your baby</button><button class="btn ghost" data-act="joinOpen">Join with a code</button></div></div>`;
  const me=myMember();

  }).join('');
  return `<div class="panel"><h2>Family</h2><div>${rows}</div><div id="memberConfirm"></div>
    ${state.canWrite?`<div class="form" style="margin-top:14px">${F.seg('invrole','Invite someone who can',[['parent','Log entries'],['viewer','Only view']],'parent')}<div><button class="btn primary" data-act="invite">Create invite code</button></div><div id="inviteOut"></div></div>`:''}</div>`;
}
function accountPanel(){
  if(!session) return '';
  const me=myMember();
  return `<div class="panel"><h2>Account</h2><p>Signed in as <b>${esc(session.user.email||'')}</b></p>
    ${state.mode==='cloud'?`<form class="form" id="nameForm"><div class="row2" style="align-items:end">${F.text('me_name','Your name, shown to family',me?.display_name||'','e.g. Mom, Dad, Grandma')}<div><button class="btn" type="submit">Save name</button></div></div></form>`:''}

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${state.mode==='cloud'?`<button class="btn ghost" data-act="addBaby">Add another baby</button><button class="btn ghost" data-act="joinOpen">Join with a code</button>`:''}<button class="btn danger" data-act="signout">Sign out</button></div>

      <ul style="margin:0;padding-left:20px;color:var(--ink-2)"><li>A log someone else also uses stays with them, and they become its owner.</li><li>A log only you use is deleted with all its entries.</li></ul>

/* ---------- modal + forms ---------- */
function openModal(html){ document.getElementById('modalRoot').innerHTML=`<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector('.modal input:not([type=radio]),.modal select,.modal button'); f&&f.focus(); }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function toast(msg){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.undo=null; toast.t=setTimeout(()=>r.innerHTML='',2400); }
function toastUndo(msg, fn){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast undo" role="status"><span>${esc(msg)}</span><button type="button" data-act="undo">Undo</button></div>`; clearTimeout(toast.t); toast.undo=fn; toast.t=setTimeout(()=>{ r.innerHTML=''; toast.undo=null; },6000); }

const F = {
  time:(id,label,v)=>`<label class="field"><span>${label}</span><input type="datetime-local" id="${id}" value="${v?toInput(v):''}"></label>`,
  num:(id,label,v,unit,step='any')=>`<label class="field"><span>${label}${unit?` (${unit})`:''}</span><input type="number" inputmode="decimal" step="${step}" min="0" id="${id}" value="${v??''}"></label>`,
  text:(id,label,v,ph='')=>`<label class="field"><span>${label}</span><input type="text" id="${id}" value="${esc(v??'')}" placeholder="${esc(ph)}"></label>`,
  area:(id,label,v)=>`<label class="field"><span>${label}</span><textarea id="${id}">${esc(v??'')}</textarea></label>`,
  seg:(name,label,opts,v)=>`<div class="field"><span>${label}</span><div class="segs" role="radiogroup">${opts.map(([val,l])=>`<label><input type="radio" name="${name}" value="${val}" ${v===val?'checked':''}><span>${l}</span></label>`).join('')}</div></div>`,
  check:(id,label,v)=>`<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="${id}" ${v?'checked':''}> ${label}</label>`
};
const val = id => document.getElementById(id)?.value;
const radio = n => document.querySelector(`input[name="${n}"]:checked`)?.value;
const numv = id => { const v=val(id); return v===''||v==null?null:+v; };

const volUnitFor = e => e.volUnit || prefs.volUnit || (U.imp()?'oz':'ml');
function fieldsFor(type, e){
  const now=Date.now();
  switch(type){
    case 'breast': return F.time('f_start','Started',e.start||now-15*MIN)+`<div class="row2">${F.num('f_l','Left',e.left!=null?Math.round(e.left/MIN):'', 'min','1')}${F.num('f_r','Right',e.right!=null?Math.round(e.right/MIN):'','min','1')}</div>`+F.text('f_note','Note',e.note);
    case 'bottle': { const vu=volUnitFor(e); return F.time('f_start','Time',e.start||now)+`<div class="row2" style="align-items:end">${F.num('f_amt','Amount',U.volTo(e.amount,vu),'')}${F.seg('vunit','Unit',[['oz','oz'],['ml','ml']],vu)+`<input type="hidden" id="f_vprev" value="${vu}">`}</div>`+F.seg('contents','Contents',[['breastmilk','Breast milk'],['formula','Formula'],['other','Other']],e.contents||'breastmilk')+(!e.id&&stashItems().some(x=>x.where!=='freezer'&&x.useBy>now)?`<label class="chk" id="stashBox" style="margin-top:-4px" ${(e.contents||'breastmilk')==='breastmilk'?'':'hidden'}><input type="checkbox" id="f_stash" checked> From the milk stash (takes the amount from the oldest bag first)</label>`:'')+F.text('f_note','Note',e.note)+`<p class="note">Tip: burp every 2–3 oz (60–90 ml), then keep ${pron()==='my baby'?'your baby':pron()==='she'?'her':'him'} upright 10–15 minutes after the feed.</p>`; }
    case 'solids': return F.time('f_start','Time',e.start||now)+F.text('f_food','Food',e.food,'e.g. mashed banana')+F.text('f_amtt','Amount',e.amountText,'e.g. 2 tbsp')+F.seg('reaction','How it went',[['liked','Liked'],['neutral','Okay'],['disliked','Disliked'],['reaction','Reaction']],e.reaction||'liked')+F.text('f_note','Note',e.note);
    case 'pump': { const vu=volUnitFor(e); return F.time('f_start','Time',e.start||now)+F.seg('vunit','Unit',[['oz','oz'],['ml','ml']],vu)+`<input type="hidden" id="f_vprev" value="${vu}">`+`<div class="row2">${F.num('f_l','Left',U.volTo(e.left,vu),'')}${F.num('f_r','Right',U.volTo(e.right,vu),'')}</div>`+F.num('f_dur','Duration',e.duration,'min','1')+(prefs.stash==='hide'?'':F.seg('store','Where the milk goes',[['','Not tracked'],['fed','Fed now'],['fridge','Fridge'],['freezer','Freezer']],e.id?(e.store||''):(prefs.lastStore||'')))+F.text('f_note','Note',e.note)+(prefs.stash==='hide'?'':`<p class="note">Pick Fridge or Freezer to add it to the milk stash on Home.</p>`); }
    case 'sleep': return F.seg('kind','Type',[['nap','Nap'],['night','Night sleep']],e.kind||(new Date().getHours()>=19||new Date().getHours()<6?'night':'nap'))+F.time('f_start','Fell asleep',e.start||now-60*MIN)+F.time('f_end','Woke up (leave empty if still asleep)',e.id?e.end:now)+F.text('f_note','Note',e.note);
    case 'diaper': { const k=e.kind||'wet', wet=k!=='dirty'&&k!=='dry', poo=k==='dirty'||k==='mixed';
      return F.time('f_start','Time',e.start||now)+F.seg('kind','Diaper',[['wet','Wet'],['dirty','Dirty'],['mixed','Both'],['dry','Dry']],k)
      +`<div id="peeBox" ${wet?'':'hidden'}>${F.seg('pee','Pee amount',[['small','Light'],['medium','Medium'],['large','Heavy']],e.pee||'')}</div>`
      +`<div id="pooBox" class="form" ${poo?'':'hidden'}>${F.seg('poo','Poo amount',[['small','Little'],['medium','Medium'],['large','Big']],e.poo||'')}
        <div class="field"><span>Color</span><div class="swatches" role="radiogroup" aria-label="Poo color">${POO_COLORS.map(([v,n,c])=>`<label class="sw"><input type="radio" name="pcolor" value="${v}" ${e.pcolor===v?'checked':''}><span style="--sw:${c};--swd:${c}"></span>${n}</label>`).join('')}</div>
        <p class="note" id="pcolorNote" ${['red','black','white'].includes(e.pcolor)?'':'hidden'}></p></div>
        ${F.seg('cons','Texture',[['seedy','Seedy'],['soft','Soft'],['runny','Runny'],['firm','Firm'],['mucus','Mucus']],e.cons||'')}</div>`
      +F.check('f_rash','Diaper rash',e.rash)+F.text('f_note','Note',e.note||(e.color&&!e.pcolor?e.color:'')); }
    case 'potty': return F.time('f_start','Time',e.start||now)+F.seg('result','Result',[['pee','Pee'],['poo','Poo'],['both','Both'],['none','Nothing']],e.result||'pee')+F.text('f_note','Note',e.note);
    case 'growth': { const wu=['lboz','lb','kg'].includes(prefs.wunit)?prefs.wunit:(U.imp()?'lboz':'kg'), lu=['in','cm'].includes(prefs.lunit)?prefs.lunit:U.lenU(), W=wtParts(e.weight), L=v=>v==null?'':lu==='cm'?+v.toFixed(1):+(v/2.54).toFixed(2);

function wConv(kg,u){ if(kg==null||!(kg>0)) return ''; const W=wtParts(kg); return u==='kg' ? `= ${W.lb} lb ${W.oz} oz` : `= ${W.kg} kg`; }

async function saveFile(name, data, mime){
  if(typeof NATIVE!=='undefined' && NATIVE){ const fsx=capPlugin('Filesystem'), sh=capPlugin('Share');
    if(fsx && sh){ try{ const bytes = typeof data==='string' ? new TextEncoder().encode(data) : new Uint8Array(data.buffer||data); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
      const r=await fsx.writeFile({path:name,data:btoa(bin),directory:'CACHE'}); await sh.share({title:name,files:[r.uri]}); return 'saved'; }catch(err){ return /cancel/i.test(String(err?.message||''))?'declined':'error'; } } }
  if(!downloads && window.claude?.use){ try{ downloads=await window.claude.use('downloads'); }catch(e){} }
  if(downloads){ try{ await downloads.save({filename:name,data}); return 'saved'; }catch(err){ return err?.code==='declined'?'declined':'error'; } }
  if(!window.claude){ // self-hosted copy: a normal browser download works here
    try{ const url=URL.createObjectURL(new Blob([data],{type:mime})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); return 'saved'; }catch(e){ return 'error'; }
  }
  return 'unavailable';
}
function reportSave(r, ok){
  const note=document.getElementById('exportNote');
  if(r==='saved'){ toast(ok); if(note) note.textContent=''; }
  else if(r==='unavailable'){ if(note) note.textContent='Downloads aren’t available in this view. Open the page on claude.ai or in a regular browser.'; }
  else if(r==='error'){ if(note) note.textContent='The file could not be saved. Try again in a moment.'; }
}

const ID_OK=/^(?!\.\.?$)[A-Za-z0-9_\-.~:@+]{1,200}$/;
function parseBackup(text){
  const d=JSON.parse(text);
  const list=Array.isArray(d)?d:d?.entries;
  if(!Array.isArray(list)) throw new Error('not a backup');
  const entries=list.filter(e=>e && typeof e==='object' && T[e.type] && typeof e.start==='number' && isFinite(e.start))
    .map(e=>{ const c={...e}; if(!ID_OK.test(String(c.id||''))) c.id=newId(); return c; });
  return {profile: d && d.profile && d.profile.birth ? d.profile : null, entries, teeth: d && d.teeth && typeof d.teeth==='object' ? d.teeth : {}};
}

async function doImport(){
  const d=pendingImport; if(!d) return;
  const prog=document.getElementById('importProgress'), btn=document.querySelector('[data-act="doImport"]');
  if(btn) btn.disabled=true;
  let n=0;
  try{
    if(state.mode==='demo'){
      state.entries=[]; state.teeth={};
      if(sb){
        const id=must(await sb.rpc('create_baby',{p_name:d.profile.name,p_birth:d.profile.birth,p_sex:d.profile.sex||'u',p_units:d.profile.units||'imperial',p_my_name:''}));
        await refreshMyBabies(); await openBaby(id, true);
      } else { state.mode='local'; state.profile=d.profile; }
    } else if(!state.profile && d.profile){ await store.setProfile(d.profile); }
    const teeth={...d.teeth,...state.teeth};
    if(state.mode==='cloud'){
      for(let i=0;i<d.fresh.length;i+=200){
        const chunk=d.fresh.slice(i,i+200).map(toRow);
        must(await sb.from('entries').upsert(chunk,{onConflict:'baby_id,id',ignoreDuplicates:true}));
        n+=chunk.length; if(prog) prog.textContent=`Imported ${n} of ${d.fresh.length}…`;
      }
      if(Object.keys(d.teeth).length) must(await sb.from('babies').update({teeth}).eq('id',baby.id));
      state.teeth=teeth; state.entries=await fetchEntries(baby.id);
    } else {
      state.entries=[...d.fresh,...state.entries].sort((a,b)=>b.start-a.start); state.teeth=teeth; n=d.fresh.length;
      if(!local.write()) throw {code:'local'};
    }
    pendingImport=null; state.localOffer=null; closeModal(); render(); toast(`Imported ${n} entries`);
  }catch(err){
    if(prog) prog.textContent = isDenied(err) ? 'You don’t have permission to add entries to this log.'
      : err?.code==='local' ? 'This browser refused to save the entries. Free up space and try again.'
      : `Import stopped after ${n} entries. Import the same file again; entries already added will be skipped.`;
    if(btn) btn.disabled=false;
  }
}

    const email=val('si_email').trim(), password=val('si_pass'), mode=radio('si_mode')||'in', st=document.getElementById('siStatus'), b=f.querySelector('button[type=submit]');
    if(!email || !password) return;
    if(password.length<6){ st.textContent='Use a password with at least 6 characters.'; return; }
    b.disabled=true; st.textContent = mode==='up' ? 'Creating your account…' : 'Signing in…';
    const CONFIRM='Supabase is still set to confirm emails. In Supabase, go to Authentication → Sign In / Providers → Email, turn off “Confirm email”, save, and try again.';
    const res = mode==='up' ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
    const err=res.error, msg=err?.message||'';
    if(err){
      st.textContent = /invalid login credentials/i.test(msg) ? 'Wrong email or password. New here? Choose Create account.'
        : /already registered|already exists/i.test(msg) ? 'That email already has an account. Choose I have an account.'
        : /at least|weak|password should/i.test(msg) ? 'Use a longer password (at least 6 characters).'
        : /not confirmed/i.test(msg) ? CONFIRM
        : /rate|too many/i.test(msg) ? 'Too many tries. Wait a minute, then try again.'
        : `Couldn’t sign in: ${msg}`;
      b.disabled=false;
    } else if(mode==='up' && !res.data?.session){ st.textContent=CONFIRM; b.disabled=false; }
    // success: the sign-in listener closes this box and loads your log
  }
  if(f.id==='joinForm'){
    const code=val('j_code').trim(), name=val('j_name').trim(), st=document.getElementById('joinStatus'), b=f.querySelector('button[type=submit]');
    if(!code){ document.getElementById('j_code').focus(); return; }
    b.disabled=true; st.textContent='Joining…';
    const {data,error}=await sb.rpc('accept_invite',{p_code:code,p_name:name});
    if(error){ st.textContent=error.message || 'That code didn’t work. Check it and try again.'; b.disabled=false; return; }
    clearJoin(); closeModal(); await refreshMyBabies(); await openBaby(data); toast('You joined '+(state.profile?.name||'the log'));
  }
  if(f.id==='nameForm'){
    const name=val('me_name').trim(); if(!name) return;
    try{ must(await sb.from('baby_members').update({display_name:name}).eq('baby_id',baby.id).eq('user_id',uid())); await loadMembers(baby.id); render(); toast('Name saved'); }
    catch(e){ toast('Couldn’t save your name. Try again.'); }
  }
  if(f.id==='sumsForm'){ const order=sumCatalog(Date.now()).map(c=>c[0]); prefs.sums=checkedSums().sort((a,b)=>order.indexOf(a)-order.indexOf(b)); savePrefs(); closeModal(); render(); toast('Today so far updated'); return; }
  if(f.id==='askForm'){ const el=document.getElementById('askQ'); const q=el.value; el.value=''; askSend(q); return; }
  if(f.id==='toothForm'){ const k=f.dataset.key; const nt={...state.teeth,[k]:{date:val('t_date')}}; closeModal(); await safe(()=>store.setTeeth(nt),'Tooth saved'); }
});

/* live clocks: update text only */
setInterval(()=>{
  const now=Date.now();
  document.querySelectorAll('[data-live]').forEach(el=>{
    const e=state.entries.find(x=>x.id===el.dataset.id); if(!e) return;
    const k=el.dataset.live;
    if(k==='sleep'||k==='act') el.textContent=fmtClock(now-e.start);
    else if(k==='cd'||k==='cdsub'||k==='cdbar'){ const tg=(e.target||0)*MIN, x=now-e.start, up=x>=tg;
      if(k==='cd') el.textContent=up?'Time’s up':fmtClock(tg-x); else if(k==='cdsub') el.textContent=up?`${fmtClock(x)} so far · goal was ${e.target} min`:`left of ${e.target} min`; else el.style.width=Math.min(100,x/tg*100).toFixed(1)+'%';
      if(up){ el.closest('.acttimer')?.classList.add('up'); if(k==='cd' && !timerRang.has(e.id) && e.end===null){ timerRang.add(e.id); if(x-tg<5000 && (!e.by_dev||e.by_dev===DEV_ID)) chime(); } } }
    else { const t=breastTotals(e,now); el.textContent=fmtClock(k==='L'?t.L:k==='R'?t.R:t.total); }
  });
},1000);
setInterval(()=>{ if(!document.querySelector('.modal') && state.view==='today') render(); },60000);

/* ---------- cloud: sign-in, babies, live sync ---------- */
const JKEY='nestling.join';
function captureJoin(){
  try{ const u=new URL(location.href); const c=u.searchParams.get('join'); if(c){ localStorage.setItem(JKEY,c.toUpperCase()); u.searchParams.delete('join'); history.replaceState(null,'',u.pathname+(u.search||'')+u.hash); } }catch(e){}
}
function pendingJoin(){ try{ return localStorage.getItem(JKEY)||''; }catch(e){ return ''; } }
function clearJoin(){ try{ localStorage.removeItem(JKEY); }catch(e){} }

function openSignIn(msg){
  openModal(`<h3 style="--c:var(--accent)">Sign in to Bebenou</h3>
  <form class="form" id="signinForm">${msg?`<p>${esc(msg)}</p>`:''}
    ${F.seg('si_mode','',[['in','I have an account'],['up','Create account']],'in')}
    <label class="field"><span>Email</span><input type="email" id="si_email" autocomplete="email" inputmode="email" required placeholder="you@example.com"></label>
    <label class="field"><span>Password</span><input type="password" id="si_pass" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"></label>
    <p class="note">Each parent makes their own account. Save your password somewhere safe; there’s no reset email.</p>
    <div id="siStatus" class="note" role="status"></div>
    <div class="actions"><div class="r"><button type="button" class="btn ghost" data-close="1">Cancel</button><button type="submit" class="btn primary">Continue</button></div></div></form>`);
}
function openJoin(code){
  openModal(`<h3 style="--c:var(--accent)">Join a baby’s log</h3>
  <form class="form" id="joinForm">
    ${F.text('j_code','Invite code',code||pendingJoin(),'8 letters and numbers')}
    ${F.text('j_name','Your name, shown to family','','e.g. Mom, Dad, Grandma')}
    <div id="joinStatus" class="note" role="status"></div>
    <div class="actions"><div class="r"><button type="button" class="btn ghost" data-close="1">Cancel</button><button type="submit" class="btn primary">Join</button></div></div></form>`);
}
function openStart(){
  openModal(`<h3 style="--c:var(--accent)">Welcome to Bebenou</h3><div class="form">
    <p>Start a new log for your baby, or join a log someone shared with you.</p>
    <button class="btn primary" data-act="addBaby" style="justify-content:center">Add your baby</button>
    <button class="btn ghost" data-act="joinOpen" style="justify-content:center">I have an invite code</button>
    <div class="actions"><div class="r"><button type="button" class="btn ghost" data-close="1">Not now</button></div></div></div>`);
}

async function refreshMyBabies(){ myBabies=must(await sb.from('baby_members').select('baby_id,role,babies(name)').eq('user_id',uid())); }
async function fetchEntries(id){
  const out=[];
  for(let from=0;;from+=1000){
    const rows=must(await sb.from('entries').select('*').eq('baby_id',id).order('start_ms',{ascending:false}).range(from,from+999));
    out.push(...rows); if(rows.length<1000) break;
  }
  return out.map(fromRow);
}
async function loadMembers(id){
  members=must(await sb.from('baby_members').select('user_id,role,display_name,joined_at').eq('baby_id',id).order('joined_at'));
  const me=myMember();
  if(!me){ await lostAccess(); return false; }
  state.canWrite = me.role!=='viewer';
  return true;
}
async function lostAccess(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  baby=null; members=[]; showSample();
  try{ await refreshMyBabies(); }catch(e){}
  if(myBabies.length) await openBaby(myBabies[0].baby_id); else { render(); toast('You no longer have access to that log.'); }
}
async function openBaby(id, quiet){
  loadingFor=id;
  try{
    const b=must(await sb.from('babies').select('*').eq('id',id).single());
    if(baby?.id!==id) state.ask=[];
    applyBabyRow(b);
    if(!(await loadMembers(id))) return;
    const es=await fetchEntries(id);
    if(loadingFor!==id) return;
    state.entries=withOutbox(es); state.mode='cloud'; state.me=uid(); state.offline=false;
    prefs.activeBaby=id; savePrefs(); cacheBaby(b);
    subscribeBaby(id); flushOutbox();
    offerChecked=true; state.localOffer=null; checkLocalOffer();
    render();
  }catch(err){
    let c=null; try{ c=JSON.parse(localStorage.getItem(CKEY(id))||'null'); }catch(e){}
    if(c && isNetErr(err)){ applyBabyRow(c.b); baby=c.b; members=c.members||[]; const me=members.find(m=>m.user_id===uid()); state.canWrite=!me||me.role!=='viewer'; state.entries=withOutbox((c.entries||[])); state.mode='cloud'; state.me=uid(); state.offline=true; render(); toast('You’re offline. Showing what was saved on this phone.'); return; }
    if(!quiet) toast('Couldn’t load the log. Check your connection and refresh.'); else throw err;
  }
}
window.addEventListener('online',()=>{ if(state.offline && baby) openBaby(baby.id,true).catch(()=>{}); });
function subscribeBaby(id){
  if(channel){ sb.removeChannel(channel); channel=null; }
  channel=sb.channel('nestling-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'entries',filter:'baby_id=eq.'+id},p=>upsertLocal(fromRow(p.new)))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'entries',filter:'baby_id=eq.'+id},p=>upsertLocal(fromRow(p.new)))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'entries'},p=>{ if(!p.old || (p.old.baby_id && p.old.baby_id!==id)) return; removeLocal(p.old.id); })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'babies',filter:'id=eq.'+id},p=>{ applyBabyRow(p.new); softRender(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'baby_members',filter:'baby_id=eq.'+id},()=>{ loadMembers(id).then(ok=>{ if(ok) softRender(); }).catch(()=>{}); })
    .subscribe();
}
async function makeInvite(){
  const role=radio('invrole')||'parent', out=document.getElementById('inviteOut');
  try{
    const code=must(await sb.rpc('create_invite',{p_baby:baby.id,p_role:role}));
    const link=`${location.origin}${location.pathname}?join=${code}`;
    out.innerHTML=`<div class="invite"><span class="label">Invite code${role==='viewer'?' · view only':''}</span><span class="code">${esc(code)}</span>
      <span class="note">Send this link or code to your coparent. It works once and expires in 7 days.</span>
      <div class="row"><input readonly id="invLink" value="${esc(link)}" aria-label="Invite link"><button class="btn sm primary" data-act="copy" data-copy="${esc(link)}" data-for="invLink">Copy link</button></div></div>`;
  }catch(err){ out.innerHTML=`<p class="note">Couldn’t create an invite. ${esc(err.message||'Try again.')}</p>`; }
}
async function removeMember(user, self){
  try{
    must(await sb.from('baby_members').delete().eq('baby_id',baby.id).eq('user_id',user));
    if(self){ toast('You left the log'); await lostAccess(); }
    else { await loadMembers(baby.id); render(); toast('Removed'); }
  }catch(err){ toast('Couldn’t remove them. Try again.'); }
}
function showSample(){ const s=sampleData(); state.mode='demo'; state.profile=s.profile; state.entries=s.entries; state.teeth=s.teeth; state.canWrite=true; }

let currentUser=null;
function startAuth(){
  sb.auth.onAuthStateChange((event, s)=>{
    session=s;
    const id=s?.user?.id||null;
    if(id && id!==currentUser){ currentUser=id; setTimeout(afterSignIn,0); }
    else if(!id && currentUser){ currentUser=null; setTimeout(signedOut,0); }
    else if(!id && event==='INITIAL_SESSION'){ render(); if(pendingJoin()) setTimeout(()=>openSignIn('Sign in to join the log you were invited to.'),0); }
  });
}
async function afterSignIn(){
  if(document.getElementById('signinForm')) closeModal();
  try{ await refreshMyBabies(); }catch(e){ if(isNetErr(e) && prefs.activeBaby && localStorage.getItem(CKEY(prefs.activeBaby))){ await openBaby(prefs.activeBaby,true).catch(()=>{}); return; } toast('Couldn’t load your logs. Check your connection and refresh.'); return; }
  const code=pendingJoin(); clearJoin();
  if(myBabies.length){ const pick=myBabies.find(m=>m.baby_id===prefs.activeBaby)||myBabies[0]; await openBaby(pick.baby_id); }
  else render();
  if(code) openJoin(code); else if(!myBabies.length) openStart();
}
function signedOut(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  baby=null; members=[]; myBabies=[]; state.ask=[]; showSample(); render(); toast('Signed out');
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(state.mode==='cloud' && baby && Date.now()-hiddenAt>20000){ const id=baby.id; flushOutbox().finally(()=>fetchEntries(id).then(es=>{ if(baby?.id===id){ state.entries=withOutbox(es); cacheBaby(baby); softRender(); } }).catch(()=>{})); }
});

/* ---------- boot ---------- */
function boot(){
  captureJoin();
  showSample(); render();
  if(sb){ startAuth(); return; }
  if(cloudWanted){ state.syncError=true; render(); return; }
  fallbackLocal();
}
function fallbackLocal(){
  const d=local.read();
  if(d && d.profile){ state.mode='local'; state.profile=d.profile; state.entries=(d.entries||[]).sort((a,b)=>b.start-a.start); state.teeth=d.teeth||{}; }
  render();
}
boot();
if(NATIVE && NATIVE_APP){
  /* Android Back: close an open form, else go back to Home, and exit only from Home. */
  NATIVE_APP.addListener('backButton',()=>{
    if(document.querySelector('.modal')){ closeModal(); return; }
    if(state.view==='settings'){ state.view='family'; render(); window.scrollTo(0,0); return; }
    if(state.view!=='today'){ state.view='today'; render(); window.scrollTo(0,0); return; }
    NATIVE_APP.exitApp();
  });
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setBars); }catch(e){}
}
/* Not inside the Android app: it already has every file on the phone, and a cache there could show last version's files after an update. */
if(!NATIVE && 'serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
})();
</script>
