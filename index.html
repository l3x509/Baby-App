/* --- Timeline --- */
function histAvg(t0){
  const born=state.profile?.birth?startOfDay(new Date(state.profile.birth+'T00:00').getTime()):-Infinity;
  const core=x=>['breast','bottle','diaper','sleep'].includes(x.type), cnt=d=>state.entries.filter(x=>core(x)&&x.start>=d&&x.start<dayAdd(d,1)).length;
  const all=[]; for(let i=1;i<=7;i++){ const d=dayAdd(t0,-i); if(dayAdd(d,1)<=born) break; const c=cnt(d); if(c) all.push({d,c,s:daySummary(d)}); }
  const cs=all.map(x=>x.c).sort((a,b)=>a-b), med=cs.length?cs[Math.floor(cs.length/2)]:0;
  const isThin=d=>{ const c=cnt(d); return d<t0 && med>0 && all.length>=4 && c>0 && c<med*0.4; };
  const ds=all.filter(x=>!isThin(x.d)).map(x=>x.s);
  const a=k=>ds.length?ds.reduce((t,s)=>t+s[k],0)/ds.length:0;
  return {isThin, n:ds.length, feeds:a('feeds'), bottleMl:a('bottleMl'), breastMs:a('breastMs'), wet:a('wet'), dirty:a('dirty')};
}
function feedDot(e){ return e.type==='diaper' ? (e.kind==='dirty'?'var(--poo)':e.kind==='mixed'?'linear-gradient(90deg,var(--diaper) 50%,var(--poo) 50%)':e.kind==='dry'?'var(--ink-3)':'var(--diaper)') : ['breast','bottle'].includes(e.type) ? 'var(--fbar)' : e.type==='solids' ? 'var(--solidc)' : color(e.type); }
function erow(e,topup){

  return `<button class="erow${topup?' tu':''}" data-edit="${esc(e.id)}" style="--dc:${feedDot(e)}"><span class="tm">${fmtTime(e.start)}</span><i class="edot" aria-hidden="true"></i><span class="et">${topup?'<span class="tut">↳ top-up</span> ':''}<b>${esc(T[e.type]?.label||e.type)}</b>${sum?' <span>'+esc(sum)+'</span>':''}${e.note?' <span>· '+esc(e.note)+'</span>':''}${awayNew.has(e.id)?'<span class="newp">New</span>':''}${e._pending?' <span class="pend" title="Saved on this phone, waiting to sync">· not synced yet</span>':''}${photoStrip(e)}<span class="by2" data-by="${esc(e.by||'')}"></span></span></button>`;

function vTimeline(noHead){

    <div class="wkf"><span class="sub wkn">${avg.n>=3?'<span><span class="hv lo" style="width:12px;height:12px;padding:0;vertical-align:-2px"></span> Well below usual</span>':''}${anyThin?'<span>“Few logs”: left out of the average</span>':''}</span>${more}</div></div>`;

  ].join('');
  const filters=[['all','All'],['feed','Feeds'],['diaper','Diapers'],['sleep','Sleep'],['health','Health'],['other','Other']];
  const match=e=>{ const c=T[e.type]?.cat; return state.filter==='all' || c===state.filter || (state.filter==='health'&&c==='growth') || (state.filter==='other'&&(c==='activity'||c==='memory')); };

  const es=all.filter(match);

  const canNext=open<t0, canPrev=dayAdd(open,-1)>=born;

    <div class="elist">${list||`<div class="empty">${state.filter==='all'?'Nothing logged this day.':'Nothing in this category.'}</div>`}</div></div>`;

function i18nDay(d){ const t=startOfDay(Date.now()); if(d===t) return 'Today'; if(d===dayAdd(t,-1)) return 'Yesterday'; return new Date(d).toLocaleDateString(LOC(), {weekday:'short', day:'numeric'}); }

/* --- Stats --- */
function barChart(days, series, fmt, title){
  const W=640,H=200,L=44,R=8,Tp=14,B=26;
  const totals=days.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
  const max=niceMax(Math.max(1,...totals));
  const bw=(W-L-R)/days.length;
  let g='';
  for(let k=0;k<=4;k++){ const v=max*k/4, y=Tp+(H-Tp-B)*(1-k/4); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v,true)}</text>`; }
  days.forEach((d,i)=>{
    let y0=H-B; const x=L+i*bw+bw*.18, w=bw*.64;
    series.forEach(s=>{ const hgt=(H-Tp-B)*s.vals[i]/max; if(hgt>0){ g+=`<rect x="${x}" y="${y0-hgt}" width="${w}" height="${hgt}" rx="3" fill="${s.color}"><title>${fmtDate(d)} · ${s.name}: ${fmt(s.vals[i])}</title></rect>`; y0-=hgt; } });
    if(days.length<=14 || i%3===0) g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${new Date(d).toLocaleDateString(LOC(), days.length<=7?{weekday:'short'}:{month:'numeric',day:'numeric'})}</text>`;
  });
  const born=state.profile?.birth?startOfDay(new Date(state.profile.birth+'T00:00').getTime()):-Infinity, today=startOfDay(Date.now());
  let idx=days.map((d,i)=>i).filter(i=>days[i]<today && days[i]>=born); if(!idx.length) idx=days.map((d,i)=>i).filter(i=>days[i]>=born); if(!idx.length) idx=days.map((d,i)=>i);
  const avg=idx.reduce((a,i)=>a+totals[i],0)/idx.length;
  const lg=series.length>1?`<div class="legend" style="margin-bottom:8px">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`:'';
  return `<div class="panel"><h2><span>${title}</span><span class="sub num">Avg ${fmt(avg)}/day</span></h2>${lg}<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}</svg></div></div>`;
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function niceStep(max,int){ const raw=Math.max(max,1e-9)/3, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; let s=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; if(int) s=Math.max(1,Math.ceil(s)); return s; }
function tChart(S, series, avg, fmt, int){
  const W=400,H=140,L=30,R=4,Tp=16,B=20, n=S.length;
  const tot=S.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
  const step=niceStep(Math.max(avg||0,...tot,int?1:0.1),int), top=Math.max(step,Math.ceil(Math.max(avg||0,...tot)/step)*step);

  const foot=`<footer class="setfoot"><div><b>Bebenou</b> · Version ${APP_VERSION}</div><div class="setlinks"><a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a><a href="terms.html" target="_blank" rel="noopener">Terms of use</a><a href="delete-account.html" target="_blank" rel="noopener">Delete account</a></div><details><summary>Sources and disclaimer</summary><p class="note">Nap windows use typical awake times by age from Cleveland Clinic and The Sleep Lady. Growth reference lines use the WHO Child Growth Standards medians (0–24 months). Teeth timing follows the American Dental Association chart. Checkups follow the AAP Bright Futures schedule. Tummy time goals follow NIH Safe to Sleep. A fever is 100.4 °F (38 °C) or higher. Bebenou is a log, not medical advice. Call your pediatrician with any health concerns.</p></details></footer>`;
  const pbar = state.mode!=='cloud' ? '' : isPremium() ? `<div class="prembar" role="status"><span class="pstar big">✦</span><span><b>Premium is on</b><span class="sub">For everyone on ${esc(state.profile?.name||'this')}’s log${baby?.premium_until&&new Date(baby.premium_until).getFullYear()<2900?' · renews or ends '+new Date(baby.premium_until).toLocaleDateString(LOC()):''}</span>${baby?.premium_by===uid()?`<a class="linkbtn" style="font-size:13px;margin-top:2px" target="_blank" rel="noopener" href="https://play.google.com/store/account/subscriptions?package=app.lexcellent.bebenou">Manage subscription</a>`:''}</span></div>` : `<button class="prembar" data-act="paywall"><span class="pstar big">✦</span><span><b>Bebenou Premium</b><span class="sub">Photos, doctor report, alerts, percentiles and more, for the whole family</span></span></button>`;
  if(!wide) return head+pbar+menu+foot;
  return head+`<div class="setwrap"><div>${pbar}${menu}${foot}</div><div class="setbody"><h2 class="setttl">${esc(title)}</h2>${setSection(sec)}</div></div>`;
}


/* --- History, Ask, Family, Settings pages --- */
function vHistory(){
  const tab=state.histTab||'days';
  let h=header('History', tab==='days'?'Tap a day to open it':`Daily patterns over the last ${state.statRange} days`);
  h+=`<div class="chips seg2" role="tablist" aria-label="History view"><button class="chip" role="tab" data-hist="days" aria-pressed="${tab==='days'}">Days</button><button class="chip" role="tab" data-hist="trends" aria-pressed="${tab==='trends'}">Trends</button></div>`;
  return h+(tab==='days'?vTimeline(true):vStats(true));
}
function vAsk(){
  const name=esc(state.profile?.name||'your baby');
  return header('Ask Bebenou', `Trusted answers, plus ${name}’s own log`)+`<div class="panel askpage"><div id="askLog" class="asklog page" aria-live="polite"></div>
    <form id="askForm" class="askform"><input id="askQ" maxlength="500" autocomplete="off" placeholder="Ask about ${name}…"><button class="btn primary" type="submit">Ask</button></form>
    <p class="note" style="margin:8px 0 0">General information, not medical advice. In an emergency, call 911.</p></div>`;
}
const SETTINGS_SPLIT='<div class="panel" id="themePanel">';
function vFamily(){
  const all=vSettings(), i=all.indexOf(SETTINGS_SPLIT), name=esc(state.profile?.name||'your baby');
  return `<div class="head"><div><div class="sub">Who can see and add to ${name}’s log</div><h1>Family</h1></div><button class="btn primary" data-view="settings">${svg('settings','width="18" height="18"')} Settings</button></div>`+all+'</div>';
}

/* ---------- names (who logged) ---------- */
function resolveNames(){
  if(state.mode!=='cloud') return;
  if(members.length<2) return;
  document.querySelectorAll('[data-by]').forEach(el=>{ const id=el.dataset.by; if(!id) return; el.textContent = id===uid() ? '' : (members.find(m=>m.user_id===id)?.display_name||''); });
}

/* ---------- install as an app ---------- */
let installEvt=null;
const isStandalone = () => { try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(e){ return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; if(state.view==='settings') softRender(); });
window.addEventListener('appinstalled', ()=>{ installEvt=null; toast('Bebenou is on your home screen'); softRender(); });
function installPanel(){
  if(NATIVE) return '';
  if(isStandalone()) return `<div class="panel"><h2>App</h2><p>Bebenou is installed on this device. Open it from your home screen.</p></div>`;
  const body = installEvt
    ? `<p>Add Bebenou to your home screen so it opens full screen, like an app.</p><button class="btn primary" data-act="install">Install app</button>`
    : isIOS()
    ? `<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>⋯</b> button next to the address bar, then <b>Share</b>. On older iPhones, tap the Share button at the bottom.</li><li>Tap <b>Add to Home Screen</b>, keep <b>Open as Web App</b> on, and tap <b>Add</b>.</li></ol>`
    : `<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>In <b>Chrome</b>, tap the <b>⋮</b> menu.</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li></ol><p class="note">On a computer, use the install icon at the right end of the address bar.</p>`;
  return `<div class="panel"><h2>Add to home screen</h2>${body}</div>`;
}

/* ---------- family + account panels ---------- */
const ROLE={owner:'Owner · logs entries and invites',parent:'Parent · logs entries and invites',viewer:'View only'};
const myMember = () => members.find(m=>m.user_id===uid());
function familyPanel(){
  if(!cloudWanted) return `<div class="panel"><h2>Family sharing</h2><p>Sync is off, so entries stay in this browser.</p><p class="note">To share with a coparent, add your Supabase project details at the top of index.html. The setup guide walks through it.</p></div>`;
  if(!session) return `<div class="panel"><h2>Family sharing</h2><p>Sign in to start a shared log. Everyone you invite sees new entries right away.</p><button class="btn primary" data-act="setup">Sign in</button></div>`;
  if(state.mode!=='cloud') return `<div class="panel"><h2>Family sharing</h2><p>Add your baby to start a log, or join one with an invite code.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="setup">Add your baby</button><button class="btn ghost" data-act="joinOpen">Join with a code</button></div></div>`;
  const me=myMember();
  const rows=members.map(m=>{
    const self=m.user_id===uid();
    const can = self ? m.role!=='owner' : me?.role==='owner';
    return `<div class="mem"><span class="av">${esc((m.display_name||'?').trim().charAt(0).toUpperCase()||'?')}</span><span class="mn"><b>${esc(m.display_name||'Parent')}${self?' (you)':''}</b><span>${ROLE[m.role]||m.role}</span></span>${can?`<button class="btn sm ghost" data-act="removeMember" data-user="${esc(m.user_id)}" data-self="${self?1:''}">${self?'Leave':'Remove'}</button>`:''}</div>`;
  }).join('');
  return `<div class="panel"><h2>People</h2><div>${rows}</div><div id="memberConfirm"></div>
    <form class="form" id="nameForm" style="margin-top:12px"><div class="row2" style="align-items:end">${F.text('me_name','Your name, shown to family',me?.display_name||'','e.g. Mom, Dad, Grandma')}<div><button class="btn" type="submit">Save name</button></div></div></form>
    ${state.canWrite?`<div class="form invbox">${F.seg('invrole','Invite someone who can',[['parent','Log entries'],['viewer','Only view']],'parent')}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="invite">Create invite code</button><button class="btn ghost" data-act="joinOpen">Join with a code</button></div><div id="inviteOut"></div></div>`:`<div style="margin-top:12px"><button class="btn ghost" data-act="joinOpen">Join with a code</button></div>`}</div>`;
}
function accountPanel(){
  if(!session) return '';
  const me=myMember();
  return `<div class="panel"><h2>Account</h2><p>Signed in as <b>${esc(session.user.email||'')}</b></p>
    <p class="note" style="margin-top:-4px">Your name, babies and invites are on the Family page.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn danger" data-act="signout">Sign out</button></div>
    <details class="more" style="margin-top:16px"><summary style="color:var(--danger)">Delete my account</summary><div class="form" style="margin-top:10px">
      <p>This permanently deletes your sign-in and your name from every log.</p>
      <ul style="margin:0;padding-left:20px;color:var(--ink-2)"><li>A log someone else also uses stays with them, and they become its owner.</li><li>A log only you use is deleted with all its entries.</li></ul>
      ${myBabies.some(m=>m.baby_id===baby?.id) && baby?.premium_by===uid() && isPremium()?`<p class="note" style="color:var(--warn-ink)"><b>You pay for Premium.</b> Deleting your account doesn’t stop Google Play from billing you. <a target="_blank" rel="noopener" href="https://play.google.com/store/account/subscriptions?package=app.lexcellent.bebenou">Cancel the subscription first</a>.</p>`:''}
      <p class="note">Save a backup first if you want a copy (Backup &amp; restore below).</p>
      <label class="field"><span>Type DELETE to confirm</span><input type="text" id="delConfirm" autocomplete="off" autocapitalize="characters"></label>
      <div><button class="btn danger" data-act="deleteAccount">Delete my account</button></div>
      <div id="delStatus" class="note" role="status"></div></div></details></div>`;
}

/* ---------- modal + forms ---------- */
function openModal(html){ document.getElementById('modalRoot').innerHTML=`<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector('.modal input:not([type=radio]),.modal select,.modal button'); f&&f.focus(); }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function toast(msg){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.undo=null; toast.t=setTimeout(()=>r.innerHTML='',2400); }
function toastUndo(msg, fn){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast undo" role="status"><span>${esc(msg)}</span><button type="button" data-act="undo">Undo</button></div>`; clearTimeout(toast.t); toast.undo=fn; toast.t=setTimeout(()=>{ r.innerHTML=''; toast.undo=null; },6000); }

const F = {
  time:(id,label,v)=>`<label class="field"><span>${label}</span><input type="datetime-local" id="${id}" value="${v?toInput(v):''}"></label>`,
  num:(id,label,v,unit,step='any')=>`<label class="field"><span>${label}${unit?` (${unit})`:''}</span><input type="number" inputmode="decimal" step="${step}" min="0" id="${id}" value="${v??''}"></label>`,
  text:(id,label,v,ph='')=>`<label class="field"><span>${label}</span><input type="text" id="${id}" value="${esc(v??'')}" placeholder="${esc(ph)}"></label>`,
  area:(id,label,v)=>`<label class="field"><span>${label}</span><textarea id="${id}">${esc(v??'')}</textarea></label>`,
  seg:(name,label,opts,v)=>`<div class="field"><span>${label}</span><div class="segs" role="radiogroup">${opts.map(([val,l])=>`<label><input type="radio" name="${name}" value="${val}" ${v===val?'checked':''}><span>${l}</span></label>`).join('')}</div></div>`,
  check:(id,label,v)=>`<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="${id}" ${v?'checked':''}> ${label}</label>`
};
const val = id => document.getElementById(id)?.value;
const radio = n => document.querySelector(`input[name="${n}"]:checked`)?.value;
const numv = id => { const v=val(id); return v===''||v==null?null:+v; };

const volUnitFor = e => e.volUnit || prefs.volUnit || (U.imp()?'oz':'ml');
function fieldsFor(type, e){
  const now=Date.now();
  switch(type){
    case 'breast': return F.time('f_start','Started',e.start||now-15*MIN)+`<div class="row2">${F.num('f_l','Left',e.left!=null?Math.round(e.left/MIN):'', 'min','1')}${F.num('f_r','Right',e.right!=null?Math.round(e.right/MIN):'','min','1')}</div>`+F.text('f_note','Note',e.note);
    case 'bottle': { const vu=volUnitFor(e); return F.time('f_start','Time',e.start||now)+`<div class="row2" style="align-items:end">${F.num('f_amt','Amount',U.volTo(e.amount,vu),'')}${F.seg('vunit','Unit',[['oz','oz'],['ml','ml']],vu)+`<input type="hidden" id="f_vprev" value="${vu}">`}</div>`+F.seg('contents','Contents',[['breastmilk','Breast milk'],['formula','Formula'],['other','Other']],e.contents||'breastmilk')+(!e.id&&stashItems().some(x=>x.where!=='freezer'&&x.useBy>now)?`<label class="chk" id="stashBox" style="margin-top:-4px" ${(e.contents||'breastmilk')==='breastmilk'?'':'hidden'}><input type="checkbox" id="f_stash" checked> From the milk stash (takes the amount from the oldest bag first)</label>`:'')+F.text('f_note','Note',e.note)+`<p class="note">Tip: burp every 2–3 oz (60–90 ml), then keep ${pron()==='my baby'?'your baby':pron()==='she'?'her':'him'} upright 10–15 minutes after the feed.</p>`; }
    case 'solids': return F.time('f_start','Time',e.start||now)+F.text('f_food','Food',e.food,'e.g. mashed banana')+F.text('f_amtt','Amount',e.amountText,'e.g. 2 tbsp')+F.seg('reaction','How it went',[['liked','Liked'],['neutral','Okay'],['disliked','Disliked'],['reaction','Reaction']],e.reaction||'liked')+F.text('f_note','Note',e.note);
    case 'pump': { const vu=volUnitFor(e); return F.time('f_start','Time',e.start||now)+F.seg('vunit','Unit',[['oz','oz'],['ml','ml']],vu)+`<input type="hidden" id="f_vprev" value="${vu}">`+`<div class="row2">${F.num('f_l','Left',U.volTo(e.left,vu),'')}${F.num('f_r','Right',U.volTo(e.right,vu),'')}</div>`+F.num('f_dur','Duration',e.duration,'min','1')+(prefs.stash==='hide'?'':F.seg('store','Where the milk goes',[['','Not tracked'],['fed','Fed now'],['fridge','Fridge'],['freezer','Freezer']],e.id?(e.store||''):(prefs.lastStore||'')))+F.text('f_note','Note',e.note)+(prefs.stash==='hide'?'':`<p class="note">Pick Fridge or Freezer to add it to the milk stash on Home.</p>`); }
    case 'sleep': return F.seg('kind','Type',[['nap','Nap'],['night','Night sleep']],e.kind||(new Date().getHours()>=19||new Date().getHours()<6?'night':'nap'))+F.time('f_start','Fell asleep',e.start||now-60*MIN)+F.time('f_end','Woke up (leave empty if still asleep)',e.id?e.end:now)+F.text('f_note','Note',e.note);
    case 'diaper': { const k=e.kind||'wet', wet=k!=='dirty'&&k!=='dry', poo=k==='dirty'||k==='mixed';
      return F.time('f_start','Time',e.start||now)+F.seg('kind','Diaper',[['wet','Wet'],['dirty','Dirty'],['mixed','Both'],['dry','Dry']],k)
      +`<div id="peeBox" ${wet?'':'hidden'}>${F.seg('pee','Pee amount',[['small','Light'],['medium','Medium'],['large','Heavy']],e.pee||'')}<p class="note" style="margin-top:-4px">Heavy counts as 2 wet diapers in the checks, for long stretches between changes.</p></div>`
      +`<div id="pooBox" class="form" ${poo?'':'hidden'}>${F.seg('poo','Poo amount',[['small','Little'],['medium','Medium'],['large','Big']],e.poo||'')}
        <div class="field"><span>Color</span><div class="swatches" role="radiogroup" aria-label="Poo color">${POO_COLORS.map(([v,n,c])=>`<label class="sw"><input type="radio" name="pcolor" value="${v}" ${e.pcolor===v?'checked':''}><span style="--sw:${c};--swd:${c}"></span>${n}</label>`).join('')}</div>
        <p class="note" id="pcolorNote" ${['red','black','white'].includes(e.pcolor)?'':'hidden'}></p></div>
        ${F.seg('cons','Texture',[['seedy','Seedy'],['soft','Soft'],['runny','Runny'],['firm','Firm'],['mucus','Mucus']],e.cons||'')}</div>`
      +F.check('f_rash','Diaper rash',e.rash)+F.text('f_note','Note',e.note||(e.color&&!e.pcolor?e.color:'')); }
    case 'potty': return F.time('f_start','Time',e.start||now)+F.seg('result','Result',[['pee','Pee'],['poo','Poo'],['both','Both'],['none','Nothing']],e.result||'pee')+F.text('f_note','Note',e.note);
    case 'growth': { const wu=['lboz','lb','kg'].includes(prefs.wunit)?prefs.wunit:(U.imp()?'lboz':'kg'), lu=['in','cm'].includes(prefs.lunit)?prefs.lunit:U.lenU(), W=wtParts(e.weight), L=v=>v==null?'':lu==='cm'?+v.toFixed(1):+(v/2.54).toFixed(2);
      return F.time('f_start','Measured',e.start||now)
      +`<div class="field"><span>Weight</span><div class="wrow"><div id="wb1" class="wb" ${wu==='lboz'?'hidden':''}><input type="number" inputmode="decimal" step="any" min="0" id="f_w" aria-label="Weight" value="${wu==='kg'?W.kg:W.lbd}"></div><div id="wb2" class="wb row2" ${wu==='lboz'?'':'hidden'}><label class="uin"><input type="number" inputmode="numeric" step="1" min="0" id="f_wlb" aria-label="Pounds" value="${W.lb}"><span>lb</span></label><label class="uin"><input type="number" inputmode="decimal" step="any" min="0" id="f_woz" aria-label="Ounces" value="${W.oz}"><span>oz</span></label></div>${F.seg('wunit','',[['lboz','lb + oz'],['lb','lb'],['kg','kg']],wu)}</div><span class="note" id="wconv">${wConv(e.weight,wu)}</span></div><input type="hidden" id="f_wprev" value="${wu}">`
      +F.seg('lunit','Length unit',[['in','in'],['cm','cm']],lu)+`<input type="hidden" id="f_lprev" value="${lu}">`
      +`<div class="row2">${F.num('f_len','Height (lying down)',L(e.length),'')}${F.num('f_head','Head',L(e.head),'')}</div><div class="row2">${F.num('f_belly','Belly',L(e.belly),'')}${F.num('f_chest','Chest',L(e.chest),'')}</div>`+F.text('f_note','Note',e.note); }
    case 'temp': return F.time('f_start','Time',e.start||now)+F.num('f_val','Temperature',U.tmpOut(e.value),U.tmpU())+F.seg('method','Method',[['rectal','Rectal'],['armpit','Armpit'],['ear','Ear'],['forehead','Forehead']],e.method||'rectal')+F.text('f_note','Note',e.note)
      +`<p class="note">A temperature of 100.4 °F (38 °C) or higher is a fever. ${(ageDays(state.profile?.birth)??999)<91?'<b>Your baby is under 3 months: call your pediatrician right away for a fever.</b> ':''}Rectal is the most accurate method for babies. When you call, say which method you used.</p>`;
    case 'med': return F.time('f_start','Time given',e.start||now)+F.text('f_name','Medicine',e.name)+F.text('f_dose','Dose',e.dose,'as on the label or prescription')+F.seg('remindH','Remind me when it’s been',[['','Off'],['4','4 h'],['6','6 h'],['8','8 h'],['12','12 h'],['24','24 h']],e.remindH?String(e.remindH):'')+F.text('f_note','Note',e.note)+`<p class="note">Use the timing on the label or from your doctor. The reminder goes to phones that have medicine reminders on.</p>`;
    case 'symptom': return F.time('f_start','Time',e.start||now)+F.area('f_note','What did you notice?',e.note);
    case 'doctor': return F.time('f_start','Date and time',e.start||now)+F.text('f_title','Reason',e.title,'e.g. 4-month checkup, ear check')+F.area('f_note','Notes',e.note)+`<p class="note">Pick a future date to add an upcoming appointment. It shows under Coming up on Home.</p>`;
    case 'vitals': return F.time('f_start','Time',e.start||now)+`<div class="row2">${F.num('f_hr','Heart rate',e.hr,'bpm','1')}${F.num('f_rr','Breathing',e.rr,'per min','1')}</div>${F.num('f_spo2','Oxygen (SpO2)',e.spo2,'%','1')}<div class="row2">${F.num('f_sys','Blood pressure, top',e.sys,'mmHg','1')}${F.num('f_dia','Blood pressure, bottom',e.dia,'mmHg','1')}</div>`
      +F.seg('vstate','Baby was',[['asleep','Asleep'],['calm','Awake, calm'],['crying','Crying']],e.state||'')+F.text('f_note','Note',e.note)
      +`<p class="note">Typical newborn ranges: heart rate 100–160 bpm (lower in deep sleep), breathing 30–60 a minute, oxygen 95% or higher. Blood pressure depends on age and size, so compare with what your care team told you. Call 911 if your baby is struggling to breathe or turns blue.</p>`;
    case 'jaundice': return F.time('f_start','Time',e.start||now)+F.seg('jmethod','How it was checked',[['look','Skin check'],['tcb','Skin meter'],['blood','Blood test']],e.method||'look')
      +F.seg('jwhere','Yellow reaches',[['none','None'],['face','Face'],['chest','Chest'],['belly','Belly'],['legs','Legs'],['soles','Palms/soles']],e.where||'')
      +F.num('f_bili','Bilirubin level (if measured)',e.bili,'mg/dL')+F.text('f_note','Note',e.note)
      +`<p class="note">Check in daylight: press gently on the nose or chest and look at the skin as it refills. Call your pediatrician the same day if yellow spreads to the belly or legs, the whites of the eyes look yellow, your baby is very sleepy or feeding poorly, or poop is pale or chalky.</p>`;
    case 'vaccine': return F.time('f_start','Date',e.start||now)+F.text('f_name','Vaccine(s)',e.name,'e.g. 2-month vaccines')+F.text('f_note','Note',e.note);
    case 'activity': return F.time('f_start','Time',e.start||now)+F.seg('akind','Activity',activityKinds().map(k=>[k,k]),e.kind||'Tummy time')+F.text('f_aother','Or type something else','','e.g. Vitamin D drops')+F.num('f_dur','Duration',e.duration,'min','1')+F.text('f_note','Note',e.note);
    case 'note': return F.time('f_start','When',e.start||now)+F.text('f_title','What happened',e.title,'e.g. First giggle')+F.check('f_ms','This is a milestone',e.milestone)+F.area('f_note','Details',e.note);
    case 'spit': return F.time('f_start','Time',e.start||now)+F.seg('skind','What happened',[['spit','Spit-up'],['vomit','Vomit']],e.kind||'spit')+F.seg('samt','Amount',[['little','A little'],['lot','A lot']],e.amount||'little')
      +F.seg('scolor','Color',[['milky','Milky'],['yellow','Yellow'],['green','Green'],['bloody','Blood in it'],['brown','Dark brown']],e.scolor||'milky')+F.check('f_force','Forceful (shot out)',e.forceful)
      +`<p class="note" id="spitNote" ${spitWarn(e)?'':'hidden'} style="color:var(--danger)">${esc(spitWarn(e))}</p>`+F.text('f_note','Note',e.note)
      +`<p class="note">Holding your baby upright for 10–15 minutes after feeds can help. Call 911 if your baby chokes and can’t breathe or turns blue.</p>`;
    case 'vitd': return F.time('f_start','Given at',e.start||now)+F.text('f_note','Note',e.note);
  }

function wtParts(kg){ if(kg==null) return {kg:'',lbd:'',lb:'',oz:''}; const toz=kg*35.27396; let lb=Math.floor(toz/16), oz=+(toz-lb*16).toFixed(1); if(oz>=16){ lb++; oz=0; } return {kg:+kg.toFixed(3), lbd:+(kg*2.20462).toFixed(2), lb, oz}; }

function wConv(kg,u){ if(kg==null||!(kg>0)) return ''; const W=wtParts(kg); return u==='kg' ? `= ${W.lb} lb ${W.oz} oz` : `= ${W.kg} kg`; }

/* ---------- export ---------- */
async function exportCsv(){
  const cols=['date','time','type','details','note'];
  const rows=[cols.join(',')].concat((await allEntries()).reverse().map(e=>[dayKey(e.start),fmtTime(e.start),T[e.type]?.label||e.type,entrySummary(e),e.note||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));
  const csv=rows.join('\n'); const name=`${(state.profile?.name||'baby').replace(/[^\w-]+/g,'-').toLowerCase()}-log-${dayKey(Date.now())}.csv`;
  reportSave(await saveFile(name,csv,'text/csv'),'Export ready');
}
async function saveFile(name, data, mime){
  if(typeof NATIVE!=='undefined' && NATIVE){ const fsx=capPlugin('Filesystem'), sh=capPlugin('Share');
    if(fsx && sh){ try{ const bytes = typeof data==='string' ? new TextEncoder().encode(data) : new Uint8Array(data.buffer||data); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
      const r=await fsx.writeFile({path:name,data:btoa(bin),directory:'CACHE'}); await sh.share({title:name,files:[r.uri]}); return 'saved'; }catch(err){ return /cancel/i.test(String(err?.message||''))?'declined':'error'; } } }
  if(!downloads && window.claude?.use){ try{ downloads=await window.claude.use('downloads'); }catch(e){} }
  if(downloads){ try{ await downloads.save({filename:name,data}); return 'saved'; }catch(err){ return err?.code==='declined'?'declined':'error'; } }
  if(!window.claude){ // self-hosted copy: a normal browser download works here
    try{ const url=URL.createObjectURL(new Blob([data],{type:mime})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); return 'saved'; }catch(e){ return 'error'; }
  }
  return 'unavailable';
}
function reportSave(r, ok){
  const note=document.getElementById('exportNote');
  if(r==='saved'){ toast(ok); if(note) note.textContent=''; }
  else if(r==='unavailable'){ if(note) note.textContent='Downloads aren’t available in this view. Open the page on claude.ai or in a regular browser.'; }
  else if(r==='error'){ if(note) note.textContent='The file could not be saved. Try again in a moment.'; }
}

async function exportBackup(){

  const data=JSON.stringify({app:'nestling',version:1,exportedAt:new Date().toISOString(),profile:state.profile,entries,teeth:state.teeth});
  const r=await saveFile(`${slugName()}-bebenou-backup-${dayKey(Date.now())}.json`,data,'application/json');

const ID_OK=/^(?!\.\.?$)[A-Za-z0-9_\-.~:@+]{1,200}$/;
function parseBackup(text){
  const d=JSON.parse(text);
  const list=Array.isArray(d)?d:d?.entries;
  if(!Array.isArray(list)) throw new Error('not a backup');
  const entries=list.filter(e=>e && typeof e==='object' && T[e.type] && typeof e.start==='number' && isFinite(e.start))
    .map(e=>{ const c={...e}; if(!ID_OK.test(String(c.id||''))) c.id=newId(); return c; });
  return {profile: d && d.profile && d.profile.birth ? d.profile : null, entries, teeth: d && d.teeth && typeof d.teeth==='object' ? d.teeth : {}};
}

async function doImport(){
  const d=pendingImport; if(!d) return;
  const prog=document.getElementById('importProgress'), btn=document.querySelector('[data-act="doImport"]');
  if(btn) btn.disabled=true;
  let n=0;
  try{
    if(state.mode==='demo'){
      state.entries=[]; state.teeth={};
      if(sb){
        const id=must(await sb.rpc('create_baby',{p_name:d.profile.name,p_birth:d.profile.birth,p_sex:d.profile.sex||'u',p_units:d.profile.units||'imperial',p_my_name:''}));
        await refreshMyBabies(); await openBaby(id, true);
      } else { state.mode='local'; state.profile=d.profile; }
    } else if(!state.profile && d.profile){ await store.setProfile(d.profile); }
    const teeth={...d.teeth,...state.teeth};
    if(state.mode==='cloud'){
      for(let i=0;i<d.fresh.length;i+=200){
        const chunk=d.fresh.slice(i,i+200).map(toRow);
        must(await sb.from('entries').upsert(chunk,{onConflict:'baby_id,id',ignoreDuplicates:true}));
        n+=chunk.length; if(prog) prog.textContent=`Imported ${n} of ${d.fresh.length}…`;
      }
      if(Object.keys(d.teeth).length) must(await sb.from('babies').update({teeth}).eq('id',baby.id));
      state.teeth=teeth; state.entries=await fetchEntries(baby.id);
    } else {
      state.entries=[...d.fresh,...state.entries].sort((a,b)=>b.start-a.start); state.teeth=teeth; n=d.fresh.length;
      if(!local.write()) throw {code:'local'};
    }
    pendingImport=null; state.localOffer=null; closeModal(); render(); toast(`Imported ${n} entries`);
  }catch(err){
    if(prog) prog.textContent = isDenied(err) ? 'You don’t have permission to add entries to this log.'
      : err?.code==='local' ? 'This browser refused to save the entries. Free up space and try again.'
      : `Import stopped after ${n} entries. Import the same file again; entries already added will be skipped.`;
    if(btn) btn.disabled=false;
  }
}

  const d=local.read(); if(!d || !Array.isArray(d.entries) || !d.entries.length) return;
  const have=new Set(state.entries.map(e=>e.id));

setInterval(()=>{
  const now=Date.now();
  document.querySelectorAll('[data-live]').forEach(el=>{
    const k0=el.dataset.live;
    if(k0==='up'||k0==='upsub'){ const u=upOn(); if(!u){ if(k0==='up') el.closest('.upbar')?.remove(); return; } const left=u.start+u.min*MIN-now;
      if(left<=0){ if(!timerRang.has('upright')){ timerRang.add('upright'); if(left>-5000) chime(); render(); } } else if(k0==='up') el.textContent=fmtClock(left); return; }
    const e=state.entries.find(x=>x.id===el.dataset.id); if(!e) return;
    const k=el.dataset.live;
    if(k==='sleep'||k==='act') el.textContent=fmtClock(now-e.start);
    else if(k==='cd'||k==='cdsub'||k==='cdbar'){ const tg=(e.target||0)*MIN, x=now-e.start, up=x>=tg;
      if(k==='cd') el.textContent=up?'Time’s up':fmtClock(tg-x); else if(k==='cdsub') el.textContent=up?`${fmtClock(x)} so far · goal was ${e.target} min`:`left of ${e.target} min`; else el.style.width=Math.min(100,x/tg*100).toFixed(1)+'%';

async function refreshMyBabies(){ myBabies=must(await sb.from('baby_members').select('baby_id,role,babies(name)').eq('user_id',uid())); }
async function fetchEntries(id){
  const out=[];
  for(let from=0;;from+=1000){
    const rows=must(await sb.from('entries').select('*').eq('baby_id',id).order('start_ms',{ascending:false}).range(from,from+999));
    out.push(...rows); if(rows.length<1000) break;
  }
  return out.map(fromRow);
}
async function loadMembers(id){
  members=must(await sb.from('baby_members').select('user_id,role,display_name,joined_at').eq('baby_id',id).order('joined_at'));
  const me=myMember();
  if(!me){ await lostAccess(); return false; }
  state.canWrite = me.role!=='viewer';
  return true;
}
async function lostAccess(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  baby=null; members=[]; showSample();
  try{ await refreshMyBabies(); }catch(e){}
  if(myBabies.length) await openBaby(myBabies[0].baby_id); else { render(); toast('You no longer have access to that log.'); }

async function openBaby(id, quiet){
  loadingFor=id;
  try{
    const b=must(await sb.from('babies').select('*').eq('id',id).single());
    if(baby?.id!==id) state.ask=[];
    applyBabyRow(b);
    if(!(await loadMembers(id))) return;
    const es=await fetchEntries(id);
    if(loadingFor!==id) return;
    state.entries=withOutbox(es); state.mode='cloud'; state.me=uid(); state.offline=false;
    prefs.activeBaby=id; savePrefs(); cacheBaby(b);
    subscribeBaby(id); flushOutbox();
    offerChecked=true; state.localOffer=null; checkLocalOffer();
    render();
  }catch(err){
    let c=null; try{ c=JSON.parse(localStorage.getItem(CKEY(id))||'null'); }catch(e){}
    if(c && isNetErr(err)){ applyBabyRow(c.b); baby=c.b; members=c.members||[]; const me=members.find(m=>m.user_id===uid()); state.canWrite=!me||me.role!=='viewer'; state.entries=withOutbox((c.entries||[])); state.mode='cloud'; state.me=uid(); state.offline=true; render(); toast('You’re offline. Showing what was saved on this phone.'); return; }
    if(!quiet) toast('Couldn’t load the log. Check your connection and refresh.'); else throw err;
  }
}
window.addEventListener('online',()=>{ if(state.offline && baby) openBaby(baby.id,true).catch(()=>{}); });
function subscribeBaby(id){
  if(channel){ sb.removeChannel(channel); channel=null; }
  channel=sb.channel('nestling-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'entries',filter:'baby_id=eq.'+id},p=>upsertLocal(fromRow(p.new)))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'entries',filter:'baby_id=eq.'+id},p=>upsertLocal(fromRow(p.new)))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'entries'},p=>{ if(!p.old || (p.old.baby_id && p.old.baby_id!==id)) return; removeLocal(p.old.id); })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'babies',filter:'id=eq.'+id},p=>{ applyBabyRow(p.new); softRender(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'baby_members',filter:'baby_id=eq.'+id},()=>{ loadMembers(id).then(ok=>{ if(ok) softRender(); }).catch(()=>{}); })
    .subscribe();
}

let currentUser=null;
function startAuth(){
  sb.auth.onAuthStateChange((event, s)=>{
    session=s;
    if(event==='PASSWORD_RECOVERY') setTimeout(openNewPassword,900);
    const id=s?.user?.id||null;
    if(id && id!==currentUser){ currentUser=id; setTimeout(afterSignIn,0); }
    else if(!id && currentUser){ currentUser=null; setTimeout(signedOut,0); }
    else if(!id && event==='INITIAL_SESSION'){ render(); if(pendingJoin()) setTimeout(()=>openSignIn('Sign in to join the log you were invited to.'),0); }
  });
}
async function afterSignIn(){
  if(document.getElementById('signinForm')) closeModal();
  try{ await refreshMyBabies(); }catch(e){ if(isNetErr(e) && prefs.activeBaby && localStorage.getItem(CKEY(prefs.activeBaby))){ await openBaby(prefs.activeBaby,true).catch(()=>{}); return; } toast('Couldn’t load your logs. Check your connection and refresh.'); return; }
  const code=pendingJoin(); clearJoin();
  if(myBabies.length){ const pick=myBabies.find(m=>m.baby_id===prefs.activeBaby)||myBabies[0]; await openBaby(pick.baby_id); }
  else render();
  if(code) openJoin(code); else if(!myBabies.length) openStart();
}
function signedOut(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  baby=null; members=[]; myBabies=[]; state.ask=[]; showSample(); render(); toast('Signed out');
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(state.mode==='cloud' && baby && Date.now()-hiddenAt>20000){ const id=baby.id; flushOutbox().finally(()=>fetchEntries(id).then(es=>{ if(baby?.id===id){ state.entries=withOutbox(es); cacheBaby(baby); softRender(); } }).catch(()=>{})); }
});

function boot(){
  captureJoin();
  showSample(); render();

}
function fallbackLocal(){

  render();
}

/* =====================================================================
   PHOTOS on entries. Cloud: private "photos" bucket, path <baby>/<id>.jpg.
   Sample/self-hosted: small JPEGs kept inside the entry.
   ===================================================================== */
const PHOTO_TYPES=['diaper','spit','symptom','temp','jaundice','solids','growth','doctor','vaccine','med','note','activity','vitals','potty'];
let photoDraft=null;   // {keep:[paths], add:[{blob,url}], drop:[paths]}
const photoUrls=new Map();
async function shrinkImage(file, max=1280, q=0.8){
  const img=await new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src=URL.createObjectURL(file); });
  const r=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*r); c.height=Math.round(img.naturalHeight*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  return await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));
}
const blobToDataUrl = b => new Promise(ok=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(b); });
function photoField(e){
  photoDraft={keep:[...(e.photos||[])], add:[], drop:[]};
  return `<div class="field"><span>Photos ${pBadge()}</span><div class="phrow" id="phRow">${photoThumbs()}</div><p class="note" style="margin-top:4px">Shown only to your family. Included in the doctor report.</p></div>`;
}
function photoThumbs(){
  if(!photoDraft) return '';
  const k=photoDraft.keep.map((p,i)=>`<span class="pht"><img data-photo="${esc(p)}" alt="Photo"><button type="button" class="phx" data-act="phDel" data-i="${i}" aria-label="Remove photo">×</button></span>`).join('');
  const a=photoDraft.add.map((p,i)=>`<span class="pht"><img src="${p.url}" alt="New photo"><button type="button" class="phx" data-act="phDelNew" data-i="${i}" aria-label="Remove photo">×</button></span>`).join('');
  const n=photoDraft.keep.length+photoDraft.add.length;
  return k+a+(n<4&&state.canWrite?`<label class="phadd">${svg('photo')}<span>Add</span><input type="file" accept="image/*" id="phFile" hidden></label>`:'');
}
async function photoPicked(input){
  const f=input.files&&input.files[0]; input.value=''; if(!f) return;
  if(needPremium('photos')) return;
  try{ const b=await shrinkImage(f, state.mode==='cloud'?1280:900, state.mode==='cloud'?0.8:0.7); photoDraft.add.push({blob:b,url:URL.createObjectURL(b)}); }
  catch(e){ toast('That photo couldn’t be read. Try another one.'); }

}
async function photoCommit(){   // returns the photos array to save, or undefined when unchanged
  if(!photoDraft) return undefined;
  const d=photoDraft; photoDraft=null;
  if(!d.add.length && !d.drop.length) return undefined;
  const out=[...d.keep];
  for(const p of d.add){
    if(state.mode==='cloud'){
      const path=`${baby.id}/${newId()}.jpg`;
      const {error}=await sb.storage.from('photos').upload(path,p.blob,{contentType:'image/jpeg',upsert:false});
      if(error){ toast('A photo couldn’t be uploaded. Check your connection.'); continue; }
      out.push(path);
    } else out.push(await blobToDataUrl(p.blob));
    URL.revokeObjectURL(p.url);
  }
  if(state.mode==='cloud' && d.drop.length) sb.storage.from('photos').remove(d.drop.filter(x=>!x.startsWith('data:'))).catch(()=>{});
  return out;
}
async function photoUrl(path){
  if(!path) return '';
  if(path.startsWith('data:')) return path;
  const c=photoUrls.get(path); if(c && c.exp>Date.now()) return c.url;
  if(!sb) return '';
  const {data}=await sb.storage.from('photos').createSignedUrl(path,3600);
  const url=data?.signedUrl||''; if(url) photoUrls.set(path,{url,exp:Date.now()+50*MIN}); return url;
}
function hydratePhotos(root){
  (root||document).querySelectorAll?.('img[data-photo]:not([src])').forEach(async img=>{ const u=await photoUrl(img.dataset.photo); if(u) img.src=u; });
}
new MutationObserver(ms=>{ for(const m of ms) m.addedNodes.forEach(n=>{ if(n.nodeType===1){ if(n.matches?.('img[data-photo]')) hydratePhotos(n.parentNode); else if(n.querySelector?.('img[data-photo]')) hydratePhotos(n); } }); }).observe(document.body,{childList:true,subtree:true});
function openPhoto(path){
  const ov=document.createElement('div'); ov.className='phview'; ov.setAttribute('role','dialog'); ov.innerHTML=`<img data-photo="${esc(path)}" alt="Photo"><button type="button" class="btn" aria-label="Close">✕</button>`;

/* =====================================================================
   ALERTS. Safety alerts are free for everyone; pattern alerts are Premium.
   ===================================================================== */
function alertsList(now=Date.now()){
  const p=state.profile||{}, age=ageDays(p.birth)??99, nm=p.name||'Your baby', out=[];
  const t0=startOfDay(now), ps=state.entries.filter(e=>e.start<=now);
  // safety (free)
  const fever=ps.find(e=>e.type==='temp' && e.value>=38 && e.start>now-24*HR);
  if(fever) out.push({safe:true, lvl:'red', ic:'temp', t: age<91 ? `Fever of ${U.tmp(fever.value)} at ${fmtTime(fever.start)}. Under 3 months, call your pediatrician now.` : `Fever of ${U.tmp(fever.value)} at ${fmtTime(fever.start)}. Call your pediatrician if ${nm} seems unwell or it lasts.`});
  const jd=ps.find(e=>e.type==='jaundice' && ['belly','legs','soles'].includes(e.where) && e.start>now-48*HR);
  if(jd) out.push({safe:true, lvl:'red', ic:'sun', t:`Yellow skin reached the ${({belly:'belly',legs:'legs',soles:'palms or soles'})[jd.where]}. Call your pediatrician today.`});
  const bad=ps.find(e=>e.type==='diaper' && ['red','black','white'].includes(e.pcolor) && e.start>now-48*HR && !(e.pcolor==='black' && age<4));
  if(bad) out.push({safe:true, lvl:'red', ic:'diaper', t:`${({red:'Red',black:'Black',white:'White or pale'})[bad.pcolor]} poop logged ${relDays(bad.start,now)}. Call your pediatrician.`});
  // patterns (premium)
  if(age>=5 && age<183){
    const d1=daySummary(dayAdd(t0,-1)), d2=daySummary(dayAdd(t0,-2));
    const logged=x=>x.feeds+x.diapers>3;
    if(logged(d1)&&logged(d2) && d1.wetEq<6 && d2.wetEq<6){
      const gap=(d1.gapH+d2.gapH)/2, signs=lowIntakeSigns([d1,d2],[3,4,5].map(i=>daySummary(dayAdd(t0,-i))));
      if(gap>4 && !signs.length) out.push({lvl:'info', ic:'diaper', t:`Changes were about ${Math.round(gap*10)/10}h apart, so the wet count (${d2.wetEq} and ${d1.wetEq}) may look low. Feeds look steady. Mark soaked diapers as Heavy so they count as 2.`});
      else out.push({lvl:'amber', ic:'diaper', t:`Wet diapers were under 6 on each of the last 2 days (${d2.wetEq} and ${d1.wetEq})${signs.includes('weight')?' and weight gain is low':signs.length?' and '+(signs[0]==='feeds'?'feeds':'bottles')+' dropped too':''}. Offer feeds more often and call your pediatrician if it continues.`});
    }
  }
  if(age<42){
    const lastDirty=ps.find(e=>e.type==='diaper' && (e.kind==='dirty'||e.kind==='mixed'));
    const anyDiaper=ps.some(e=>e.type==='diaper' && e.start>now-24*HR);
    if(anyDiaper && (!lastDirty || now-lastDirty.start>48*HR) && age>=4) out.push({lvl:'amber', ic:'diaper', t:`No dirty diaper logged in ${lastDirty?fmtDur(now-lastDirty.start):'2 days'}. In the first weeks, mention it to your pediatrician.`});
  }
  if(age<91){
    const fs=ps.filter(e=>(e.type==='breast'||e.type==='bottle') && e.start>t0).sort((a,b)=>a.start-b.start);
    const lf=ps.find(e=>e.type==='breast'||e.type==='bottle');
    const h=new Date(now).getHours();
    if(lf && h>=8 && h<21 && now-(lf.end||lf.start)>4*HR && fs.length) out.push({lvl:'amber', ic:'bottle', t:`No feed logged for ${fmtDur(now-(lf.end||lf.start))}. Was one missed?`});
  }
  const soon=stashItems(now).filter(x=>x.where!=='freezer' && x.useBy>now && x.useBy-now<24*HR);
  if(soon.length) out.push({lvl:'amber', ic:'pump', t:`${soon.length} ${soon.length===1?'bag':'bags'} of milk (${U.vol(soon.reduce((a,x)=>a+x.ml,0))}) must be used by ${fmtTime(soon[0].useBy)}${startOfDay(soon[0].useBy)!==t0?' tomorrow':''}.`});
  return out;
}
function alertsCard(now){
  const all=alertsList(now); if(!all.length) return '';
  const prem=isPremium(), show=all.filter(a=>a.safe||prem), hidden=all.length-show.length;
  if(!show.length && !hidden) return '';
  return `<div class="panel alerts">${show.map(a=>`<div class="al al-${a.lvl}"><span class="ii ${IC()}">${svg(a.ic)}</span><span>${esc(a.t)}</span></div>`).join('')}
    ${hidden?`<button class="al al-lock" data-act="paywall" data-k="alerts"><span class="pstar">✦</span><span>${hidden} more ${hidden===1?'heads-up':'heads-ups'} about patterns with Premium</span></button>`:''}</div>`;
}

/* =====================================================================
   GROWTH PERCENTILES (WHO LMS, 0–24 months) and weight-gain chart
   ===================================================================== */
function lmsAt(kind, months, sex){
  const T=WHO_LMS[kind]; if(!T) return null;
  const pick=s=>{ const a=T[s], m=Math.max(0,Math.min(24,months)), i=Math.floor(m), f=m-i, A=a[i], B=a[Math.min(24,i+1)]; return A.map((v,k)=>v+(B[k]-v)*f); };
  if(sex==='m'||sex==='f') return pick(sex);
  const a=pick('m'), b=pick('f'); return a.map((v,k)=>(v+b[k])/2);
}
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2); let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function percentile(kind, value, atMs){
  const p=state.profile||{}; if(!p.birth || value==null) return null;
  const months=ageDays(p.birth,atMs)/30.4375; if(months<0||months>24.5) return null;
  const v = kind==='w' ? value : value;        // weight in kg, lengths in cm (as stored)
  const [L,M,S]=lmsAt(kind,months,p.sex);
  const z = Math.abs(L)<1e-6 ? Math.log(v/M)/S : (Math.pow(v/M,L)-1)/(L*S);
  return Math.max(0.1,Math.min(99.9,normCdf(z)*100));
}
const ordinal = n => { const r=Math.round(n); if(curLang()!=='en') return String(r); const s=['th','st','nd','rd'], v=r%100; return r+(s[(v-20)%10]||s[v]||s[0]); };
function percentilePanel(){
  const gs=state.entries.filter(e=>e.type==='growth' && e.start<=Date.now()).sort((a,b)=>b.start-a.start);
  if(!gs.length || !state.profile?.birth) return '';
  if(!isPremium()) return lockedCard('percentiles','Growth percentiles','See where your baby sits on the WHO curves and how fast weight is going up each week.');
  const last=k=>gs.find(e=>e[k]!=null);
  const rows=[['w','weight','Weight',U.wt],['l','length','Height',U.len],['h','head','Head',U.len]].map(([k,f,l,fmt])=>{ const e=last(f); if(!e) return ''; const pc=percentile(k,e[f],e.start); if(pc==null) return '';
    return `<div class="pcr"><div><b>${l}</b><span class="sub">${fmt(e[f])} · ${new Date(e.start).toLocaleDateString(LOC(), {month:'short',day:'numeric'})}</span></div><div class="pcbar"><i style="left:${pc}%"></i></div><b class="num">${ordinal(pc)}</b></div>`; }).join('');
  // weekly weight gain between weigh-ins at least 4 days apart
  const ws=gs.filter(e=>e.weight!=null).slice().reverse(), gains=[];
  for(let i=1;i<ws.length;i++){ let j=i-1; while(j>0 && ws[i].start-ws[j].start<4*DAY) j--; const dt=(ws[i].start-ws[j].start)/(7*DAY); if(dt>=4/7) gains.push({at:ws[i].start, g:(ws[i].weight-ws[j].weight)/dt}); }
  const age=ageDays(state.profile.birth)??0, lo=age<91?0.142:0.085, hi=age<91?0.198:0.142;   // kg per week (5–7 oz, then 3–5 oz)
  const toU=kg=>U.imp()?kg*35.274:kg*1000, wu=U.imp()?'oz':'g';
  const gch = gains.length ? (()=>{ const W=400,H=130,L=44,B=18,T=10, n=gains.slice(-8), mx=Math.max(toU(hi)*1.4,...n.map(x=>toU(x.g))), mn=Math.min(0,...n.map(x=>toU(x.g))), y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn)), bw=(W-L)/n.length;
      let g=`<rect x="${L}" y="${y(toU(hi))}" width="${W-L}" height="${y(toU(lo))-y(toU(hi))}" fill="var(--diaper)" opacity=".15"/>`;
      n.forEach((x,i)=>{ const v=toU(x.g), x0=L+i*bw+bw*.2, w=bw*.6; g+=`<rect x="${x0}" y="${Math.min(y(v),y(0))}" width="${w}" height="${Math.abs(y(v)-y(0))||1}" rx="3" fill="${x.g<lo*0.85?'var(--warn-ink)':'var(--fbar)'}"/><text x="${x0+w/2}" y="${H-4}" text-anchor="middle">${new Date(x.at).toLocaleDateString(LOC(), {month:'numeric',day:'numeric'})}</text>`; });
      g+=`<text x="${L-4}" y="${(y(toU(hi))+y(toU(lo)))/2+4}" text-anchor="end">${Math.round(toU(lo))}–${Math.round(toU(hi))}</text><line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
      return `<div class="chartwrap mc"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly weight gain">${g}</svg></div><p class="note">Bars: ${wu} gained per week between weigh-ins. Green band: the usual range for ${age<91?'0–3':'3–6'} months.</p>`; })() : '<p class="note">Log two weights a few days apart to see weekly gain.</p>';
  return `<div class="panel"><h2>Percentiles <span class="sub" style="font-weight:500">WHO</span></h2>${rows||'<p class="note">Percentiles cover birth to 24 months.</p>'}
    <p class="note">50th means half of babies the same age${state.profile.sex==='m'||state.profile.sex==='f'?' and sex':''} are smaller. A steady curve matters more than the number.${state.profile.sex==='m'||state.profile.sex==='f'?'':' Set the sex in the baby’s profile for exact values.'}</p>
    <h3 class="h3s">Weight gain per week</h3>${gch}</div>`;
}

/* =====================================================================
   CARE TRENDS (temperature, bilirubin, heart rate) and medicine overview
   ===================================================================== */
function lineChart(pts, fmt, opts={}){
  if(pts.length<2) return '<p class="note">Log at least two readings to see a chart.</p>';
  const W=400,H=120,L=48,R=6,T=10,B=18, xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys,opts.lo??Infinity), y1=Math.max(...ys,opts.hi??-Infinity), pad=(y1-y0)*0.15||1;
  const X=x=>L+(W-L-R)*((x-x0)/((x1-x0)||1)), Y=y=>T+(H-T-B)*(1-(y-(y0-pad))/((y1-y0)+2*pad));
  let g='';
  if(opts.band) g+=`<rect x="${L}" y="${Y(opts.band[1])}" width="${W-L-R}" height="${Math.max(1,Y(opts.band[0])-Y(opts.band[1]))}" fill="var(--diaper)" opacity=".14"/>`;
  if(opts.line!=null) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(opts.line)}" y2="${Y(opts.line)}" stroke="var(--warn-ink)" stroke-dasharray="4 4"/>`;
  g+=`<polyline fill="none" stroke="${opts.color||'var(--accent)'}" stroke-width="2.5" points="${pts.map(p=>`${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ')}"/>`;
  g+=pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${opts.color||'var(--accent)'}"><title>${new Date(p.x).toLocaleDateString(LOC(), {month:'short',day:'numeric'})} ${fmtTime(p.x)} · ${fmt(p.y)}</title></circle>`).join('');
  g+=`<text x="${L-4}" y="${Y(y1)+4}" text-anchor="end">${fmt(y1,true)}</text><text x="${L-4}" y="${Y(y0)+4}" text-anchor="end">${fmt(y0,true)}</text>`;
  g+=`<text x="${L}" y="${H-3}">${new Date(x0).toLocaleDateString(LOC(), {month:'short',day:'numeric'})}</text><text x="${W-R}" y="${H-3}" text-anchor="end">${new Date(x1).toLocaleDateString(LOC(), {month:'short',day:'numeric'})}</text>`;
  return `<div class="chartwrap mc"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function careTrendsPanel(){
  const now=Date.now(), es=state.entries.filter(e=>e.start<=now && e.start>now-60*DAY);
  const temps=es.filter(e=>e.type==='temp'&&e.value!=null).map(e=>({x:e.start,y:U.imp()?e.value*9/5+32:e.value})).reverse();
  const bili=es.filter(e=>e.type==='jaundice'&&e.bili!=null).map(e=>({x:e.start,y:e.bili})).reverse();
  const hr=es.filter(e=>e.type==='vitals'&&e.hr).map(e=>({x:e.start,y:e.hr})).reverse();
  const meds=state.entries.filter(e=>e.type==='med' && e.start<=now);
  if(!temps.length && !bili.length && !hr.length && !meds.length) return '';
  if(!isPremium()) return lockedCard('care','Health trend charts','Temperature, bilirubin and heart rate over time, plus an overview of every medicine.');
  let h='';
  if(temps.length) h+=`<h3 class="h3s">Temperature</h3>`+lineChart(temps,(v)=>(Math.round(v*10)/10)+(U.imp()?'°F':'°C'),{line:U.imp()?100.4:38,color:'var(--health)'});
  if(bili.length) h+=`<h3 class="h3s">Bilirubin</h3>`+lineChart(bili,(v)=>String(Math.round(v*10)/10),{color:'var(--solidc)'})+`<p class="note">mg/dL. Your pediatrician compares it with a chart for age in hours.</p>`;
  if(hr.length) h+=`<h3 class="h3s">Heart rate</h3>`+lineChart(hr,(v)=>String(Math.round(v)),{band:[100,160],color:'var(--feed)'})+`<p class="note">Green band: 100–160 bpm, the usual newborn range while awake.</p>`;
  if(meds.length){ const by=new Map(); meds.forEach(e=>{ const k=(e.name||'Medicine').trim(); const g=by.get(k)||{name:k,list:[]}; g.list.push(e); by.set(k,g); });
    h+=`<h3 class="h3s">Medicines</h3><div class="medl">${[...by.values()].map(g=>{ const l=g.list[0], wk=g.list.filter(e=>e.start>now-7*DAY).length, next=l.remindH?l.start+l.remindH*HR:null;
      return `<button class="medr" data-edit="${esc(l.id)}"><b>${esc(g.name)}</b><span class="sub">Last ${fmtDate(l.start)} ${fmtTime(l.start)}${l.dose?' · '+esc(l.dose):''} · ${wk} in 7 days${next&&next>now?` · next after ${fmtTime(next)}`:''}</span></button>`; }).join('')}</div>`; }
  return `<div class="panel"><h2>Trends</h2>${h}</div>`;
}

/* =====================================================================
   QUICK AND VOICE LOGGING (Premium). Plain text like "bottle 3 oz at 2".
   ===================================================================== */
function parseWhen(s, now){
  let m=s.match(/(\d+)\s*(h|hr|hrs|hours?|m|min|mins|minutes?)\s*ago/i);
  if(m) return now-(+m[1])*(/^h/i.test(m[2])?HR:MIN);
  m=s.match(/(?:\bat\s+|@\s*|\b)(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p|h)?\b(?!\s*(?:oz|ml|min|m\b|h\b|hr|hours?|°|f\b|c\b|kg|lb|g\b))/i);
  if(m && (/at|@/i.test(m[0]) || m[2] || m[3])){
    let hh=+m[1], mm=+(m[2]||0); const ap=(m[3]||'').toLowerCase(); if(hh>23||mm>59) return null;
    if(ap.startsWith('p') && hh<12) hh+=12; if(ap.startsWith('a') && hh===12) hh=0;
    const d=new Date(now); d.setHours(hh,mm,0,0); let t=d.getTime();
    if(!ap && hh<=12 && t>now) t-=12*HR;     // "at 2" means the most recent 2 o'clock
    if(t>now+5*MIN) t-=DAY;
    return t;
  }
  return null;
}
function parseQuick(raw, now=Date.now()){
  const s=' '+raw.toLowerCase().replace(/[,]/g,' ')+' ';
  const at=parseWhen(s,now)??now;
  const num=re=>{ const m=s.match(re); return m?parseFloat(m[1].replace(',','.')):null; };
  const amt=num(/(\d+(?:[.,]\d+)?)\s*(?:oz|ml|onz|onces?)\b/), unit=/(\d)\s*ml\b/.test(s)?'ml':/(\d)\s*(oz|onz|once)/.test(s)?'oz':(U.imp()?'oz':'ml');
  const toMl=v=>v==null?null:(unit==='oz'?v*29.5735:v);
  const mins=num(/(\d+)\s*(?:min|mins|minutes?|m)\b/), hrs=num(/(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hours?|heures?|horas?|è)\b(?!\s*ago)/);
  const dur=(hrs?hrs*HR:0)+(mins&&!/ago/.test(s)?mins*MIN:0);
  if(/\b(bottle|biberon|biberón|mamadeira|bibon|formula|fòmil|lait|leche|leite)\b/.test(s) && amt!=null)
    return {type:'bottle', start:at, amount:Math.round(toMl(amt)), contents:/formula|fòmil|fórmula|infantile/.test(s)?'formula':/breast|maternel|materna|materno|manman/.test(s)?'breastmilk':undefined, volUnit:unit};
  if(/\b(pump|pumped|tire|tiré|extrac|extraí|ponpe)/.test(s) && amt!=null)
    return {type:'pump', start:at, left:Math.round(toMl(amt)/2), right:Math.round(toMl(amt)/2), end:at};
  if(/\b(nurs|breastf|breast fed|fed (left|right)|tétée|tete|pecho|mamada|mamou|teté)/.test(s)){
    const side=/left|gauche|izq|esquer|gòch/.test(s)?'L':/right|droit|derech|direit|dwat/.test(s)?'R':null, d=dur||15*MIN;
    return {type:'breast', start:at-d, end:at, left:side==='R'?0:(side?d:d/2), right:side==='L'?0:(side?d:d/2)};
  }
  if(/\b(nap|slept|sleep|sieste|dormi|siesta|durmi|soneca|dòmi)/.test(s) && dur)
    return {type:'sleep', start:at-dur, end:at, kind:/night|nuit|noche|noite|lannwit/.test(s)?'night':'nap'};
  if(/\b(temp|temperature|fever|fièvre|fiebre|febre|lafyèv|tanperati)/.test(s)){ const v=num(/(\d{2,3}(?:[.,]\d+)?)/); if(v!=null) return {type:'temp', start:at, value:v>50?Math.round((v-32)*5/9*10)/10:v, method:/rect|dèyè/.test(s)?'rectal':/arm|aissel|axil/.test(s)?'armpit':undefined}; }
  if(/\b(spit|régurg|renvoi|regurg|bocanada|golfada|rejete|vomit)/.test(s)) return {type:'spit', start:at, kind:/vomit|vòmi|vómito|vômito/.test(s)?'vomit':undefined};
  if(/\b(tummy|ventre|boca abajo|bruços|sou vant)/.test(s)) return {type:'activity', kind:'Tummy time', start:at-(dur||5*MIN), end:at, duration:Math.round((dur||5*MIN)/MIN)};
  const wet=/\b(wet|pee|mouill|mojad|molhad|mouye|pipi|xixi)/.test(s), dirty=/\b(dirty|poo|poop|stool|sale|sucio|suja|sal\b|caca|cocô|poupou)/.test(s);
  if(wet||dirty||/\b(diaper|couche|pañal|fralda|kouchèt|dry|sèche|seco)\b/.test(s))
    return {type:'diaper', start:at, kind:wet&&dirty?'mixed':dirty?'dirty':wet?'wet':(/dry|sèche|seco|sèk/.test(s)?'dry':'wet')};
  return null;
}
function quickBar(){
  if(!state.canWrite) return '';
  const sr=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  return `<form class="qbar" id="quickForm" autocomplete="off"><span class="qi">${svg('spark')}</span><input id="quickIn" type="text" placeholder="Quick add: bottle 3 oz, wet diaper, nap 1h…" aria-label="Quick add">${sr?`<button type="button" class="qmic" data-act="quickMic" aria-label="Say it">${svg('mic')}</button>`:''}<button type="submit" class="btn primary sm">Add</button>${isPremium()?'':'<span class="pbadge">✦</span>'}</form>`;
}
async function quickSubmit(){
  const inp=document.getElementById('quickIn'); const raw=(inp?.value||'').trim(); if(!raw) return;

  const id=await safe(()=>store.add(d)); const lbl=T[d.type]?.label||d.type, sum=entrySummary({...d});
  toastUndo(`${lbl}${sum?' · '+sum:''} · ${fmtTime(d.start)}`, async()=>{ const e=state.entries.find(x=>x.type===d.type && x.start===d.start); if(e) await safe(()=>store.del(e.id)); });

function quickMic(){
  if(needPremium('quick')) return;

  const r=new SR(); r.lang=({en:'en-US',fr:'fr-FR',es:'es-ES',pt:'pt-BR',ht:'fr-HT'})[curLang()]||'en-US'; r.interimResults=false; r.maxAlternatives=1;

  try{ r.start(); }catch(e){}
}

/* =====================================================================
   MILESTONE TIMELINE and MONTHLY RECAP (Premium)
   ===================================================================== */
function timelinePanel(){
  const ms=state.entries.filter(e=>(e.type==='note') || (e.photos&&e.photos.length && e.type!=='diaper' && e.type!=='spit' && e.type!=='symptom')).filter(e=>e.start<=Date.now());
  if(!ms.length) return `<div class="panel"><h2>Moments <button class="btn ghost sm" data-new="note" ${state.canWrite?'':'disabled'}>+ Moment</button></h2><div class="empty">Record first smiles, rolls, words and steps here. Add a photo to build a timeline.</div></div>`;
  const prem=isPremium();
  const groups=new Map(); ms.forEach(e=>{ const d=new Date(e.start), k=d.getFullYear()*12+d.getMonth(); const g=groups.get(k)||[]; g.push(e); groups.set(k,g); });
  const p=state.profile||{};
  let h=`<div class="panel"><h2><span>Moments</span><span style="display:flex;gap:6px">${prem?'':'<span class="pbadge">✦ Timeline</span>'}<button class="btn ghost sm" data-new="note" ${state.canWrite?'':'disabled'}>+ Moment</button></span></h2>`;
  if(!prem){ h+=hList(ms,'moments')+`<button class="btn ghost sm" style="margin-top:10px" data-act="paywall" data-k="memories">✦ See the photo timeline and monthly recap</button></div>`; return h; }
  [...groups.entries()].sort((a,b)=>b[0]-a[0]).forEach(([k,list])=>{
    const y=Math.floor(k/12), m=k%12, d=new Date(y,m,15).getTime();
    h+=`<div class="tlm"><div class="tlh"><b>${new Date(y,m,1).toLocaleDateString(LOC(), {month:'long',year:'numeric'})}</b><span class="sub">${p.birth?esc(ageText(p.birth,d)):''}</span><button class="btn ghost sm" data-act="recap" data-m="${k}">Monthly recap</button></div>
      ${list.map(e=>`<button class="tli" data-edit="${esc(e.id)}"><span class="tld ${e.milestone?'ms':''}"></span><span class="tlb"><span class="sub">${new Date(e.start).toLocaleDateString(LOC(), {month:'short',day:'numeric'})}${e.milestone?' · Milestone':''}</span><b>${esc(e.title||T[e.type]?.label||'')}</b>${e.note?`<span>${esc(e.note)}</span>`:''}${photoStrip(e)}</span></button>`).join('')}</div>`;
  });
  return h+'</div>';
}
async function makeRecap(k){
  const y=Math.floor(k/12), m=k%12, a=new Date(y,m,1).getTime(), b=new Date(y,m+1,1).getTime(), p=state.profile||{}, nm=p.name||'Baby';
  const es=state.entries.filter(e=>e.start>=a && e.start<b && e.start<=Date.now());
  const days=[]; for(let d=startOfDay(a); d<Math.min(b,startOfDay(Date.now())); d=dayAdd(d,1)){ const s=daySummary(d); if(s.feeds+s.diapers>3) days.push(s); }
  const av=k2=>days.length?days.reduce((t,s)=>t+s[k2],0)/days.length:0;
  const ws=state.entries.filter(e=>e.type==='growth'&&e.weight!=null&&e.start<b).sort((x,y2)=>x.start-y2.start);
  const wEnd=ws.filter(e=>e.start<b).at(-1), wStart=ws.filter(e=>e.start<a).at(-1)||ws[0];
  const firsts=es.filter(e=>e.type==='note'&&(e.milestone||e.title)).slice(0,4);
  const photo=es.find(e=>e.photos&&e.photos.length)?.photos[0];
  const c=document.createElement('canvas'); c.width=1080; c.height=photo?1350:1080; const g=c.getContext('2d');
  const css=getComputedStyle(document.documentElement), acc=css.getPropertyValue('--accent').trim()||'#c9543f', bg=css.getPropertyValue('--bg').trim()||'#fff4ef';
  g.fillStyle=bg; g.fillRect(0,0,1080,c.height);
  let top=90;
  if(photo){ try{ const u=await photoUrl(photo); const im=await new Promise((ok,bad)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>ok(i); i.onerror=bad; i.src=u; });
      const s=Math.max(920/im.width,560/im.height), w=im.width*s, h2=im.height*s; g.save(); g.beginPath(); g.roundRect(80,80,920,560,40); g.clip(); g.drawImage(im,80+(920-w)/2,80+(560-h2)/2,w,h2); g.restore(); top=700; }catch(e){} }
  g.fillStyle=acc; g.font='700 64px system-ui, sans-serif'; g.fillText(nm,80,top+40);
  g.fillStyle='#333'; g.font='500 40px system-ui, sans-serif'; g.fillText(new Date(y,m,1).toLocaleDateString(LOC(), {month:'long',year:'numeric'})+(p.birth?' · '+tr(ageText(p.birth,Math.min(b-1,Date.now()))):''),80,top+100);
  const stats=[[tr('Feeds'),days.length?String(Math.round(av('feeds')*10)/10):'—',tr('a day')],[tr('Diapers'),days.length?String(Math.round(av('diapers'))):'—',tr('a day')],[tr('Weight'),wEnd?U.wt(wEnd.weight):'—',wStart&&wEnd&&wEnd!==wStart?(wEnd.weight>=wStart.weight?'+':'−')+U.wt(Math.abs(wEnd.weight-wStart.weight)):'']];
  stats.forEach(([l,v,s],i)=>{ const x=80+i*310; g.fillStyle='rgba(0,0,0,.05)'; g.beginPath(); g.roundRect(x,top+150,290,200,28); g.fill(); g.fillStyle='#666'; g.font='500 30px system-ui, sans-serif'; g.fillText(l,x+28,top+200); g.fillStyle='#111'; g.font='700 56px system-ui, sans-serif'; g.fillText(v,x+28,top+270); g.fillStyle='#666'; g.font='500 28px system-ui, sans-serif'; g.fillText(s,x+28,top+318); });
  let yy=top+420; g.fillStyle='#111'; g.font='700 36px system-ui, sans-serif'; if(firsts.length){ g.fillText(tr('Moments'),80,yy); yy+=56; g.font='500 32px system-ui, sans-serif'; firsts.forEach(e=>{ if(yy>c.height-80) return; g.fillText('★ '+(e.title||e.note||'').slice(0,46),80,yy); yy+=48; }); }
  g.fillStyle='#999'; g.font='500 26px system-ui, sans-serif'; g.fillText(tr('Made with')+' Bebenou',80,c.height-40);
  const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));
  const name=`${slugName()}-${y}-${String(m+1).padStart(2,'0')}-recap.png`;
  try{
    if(navigator.canShare && navigator.canShare({files:[new File([blob],name,{type:'image/png'})]})) await navigator.share({files:[new File([blob],name,{type:'image/png'})], title:`${nm} · ${new Date(y,m,1).toLocaleDateString(LOC(), {month:'long'})}`});
    else reportSave(await saveFile(name, new Uint8Array(await blob.arrayBuffer()), 'image/png'),'Recap saved');
  }catch(e){}
}

/* =====================================================================
   MILK STASH PRO: daycare bottle prep from the oldest bags
   ===================================================================== */
function openBottlePrep(){
  if(needPremium('stash')) return;
  const def=U.imp()?3:90;
  openModal(`<h3 style="--c:var(--pump)"><span class="ic ${IC()}">${svg('pump')}</span>Bottle prep</h3><div class="form">
    <p class="sub">Plan bottles for daycare or a sitter from the oldest milk first.</p>
    <div class="row2">${F.num('bp_n','Bottles',4,'','1')}${F.num('bp_s','Each bottle',def,U.imp()?'oz':'ml')}</div>
    <div id="bpOut"></div>
    <div class="actions"><div class="r"><button type="button" class="btn ghost" data-close="1">Close</button><button type="button" class="btn primary" data-act="bpPlan">Plan</button></div></div></div>`);
}
function bottlePlan(){
  const n=Math.max(1,Math.min(12,+val('bp_n')||0)), each=+val('bp_s')||0, ml=U.imp()?each*29.5735:each, need=n*ml;
  const bags=stashItems().filter(x=>x.useBy>Date.now()); let got=0; const use=[];
  for(const b of bags){ if(got>=need) break; use.push(b); got+=b.ml; }
  const out=document.getElementById('bpOut'); if(!out) return;
  if(!use.length){ out.innerHTML='<p class="note">The stash is empty.</p>'; return; }
  const short=got<need;
  out.innerHTML=`<div class="bpl">${use.map(b=>`<div class="bpr"><b class="num">${U.vol(b.ml)}</b><span>${({fridge:'Fridge',thawed:'Thawed',freezer:'Freezer'})[b.where]} · use by ${fmtDate(b.useBy)}</span></div>`).join('')}</div>
    <p class="${short?'spast':'note'}">${short?`Only ${U.vol(got)} in the stash. You need ${U.vol(need)} for ${n} bottles.`:`Use these ${use.length} bags (${U.vol(got)}) for ${n} bottles of ${U.vol(ml)}.`}${use.some(b=>b.where==='freezer')?' Thaw frozen bags in the fridge overnight.':''}</p>
    ${state.canWrite&&!short?`<button class="btn primary sm" data-act="bpUse" data-ids="${use.map(b=>b.e.id).join(',')}">Mark these bags as used</button>`:''}`;
}

/* =====================================================================
   PREPARE FOR VISIT: questions built from the log (Premium)
   ===================================================================== */
function visitQuestions(){
  const q=[], now=Date.now(), p=state.profile||{}, age=ageDays(p.birth)??99;
  alertsList(now).forEach(a=>q.push(a.t));
  const wt=weightTrend();
  if(wt?.mode==='gain'){ const g=wt.perWeek*35.274; if(g<(age<91?4.25:2.5)) q.push(`Weight gain is about ${Math.round(g*10)/10} oz a week. Is that enough?`); }
  if(wt?.mode==='loss' && wt.pct>7) q.push(`Down ${Math.round(wt.pct*10)/10}% from birth weight. When should the baby be back to birth weight?`);
  const spit=state.entries.filter(e=>e.type==='spit'&&e.start>now-7*DAY).length; if(spit>=10) q.push(`About ${Math.round(spit/7)} spit-ups a day this week. Is that normal?`);
  const meds=state.entries.filter(e=>e.type==='med'&&e.start>now-14*DAY); if(meds.length) q.push('Should we keep giving the current medicine?');
  if(age<120) q.push('Is the vitamin D dose still right?');
  return [...new Set(q)].slice(0,8);
}

// Lock-screen timer: an ongoing notification while a feed, sleep or activity timer runs (Android app).
async function syncOngoing(){
  const L=typeof LN==='function'?LN():null; if(!L) return;
  const r=state.entries.find(e=>(e.type==='breast'||e.type==='sleep'||e.type==='activity') && e.end==null);
  const sig=r?r.id+'|'+r.start:'';

    await L.cancel({notifications:[{id:900}]});

  }catch(e){}
}
