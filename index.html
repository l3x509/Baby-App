<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bebenou</title>
<meta name="apple-mobile-web-app-title" content="Bebenou">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Your Supabase keys live in config.js, so updating this file never touches them. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phones; activity colors carry meaning everywhere */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e9edf3; --line:#d8dee8;
  --ink:#1b2433; --ink-2:#556074; --ink-3:#8a93a4;
  --accent:#3d5afe; --accent-ink:#ffffff; --accent-soft:#e3e8ff; --tilemix:38%;
  --feed:#e8657a; --sleep:#5b5bd6; --diaper:#14a39a; --health:#d98a1c; --growth:#3f9b4f; --activity:#8b5cf6; --memory:#c2569b;
  --danger:#c93a3a; --warn-bg:#fff4dc; --warn-ink:#7a5208;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#171e29; --surface-2:#202a38; --line:#2c3747;
  --ink:#e8edf5; --ink-2:#a9b3c4; --ink-3:#768195;
  --accent:#8c9dff; --accent-ink:#0f141c; --accent-soft:#252f52; --tilemix:52%;
  --feed:#f08496; --sleep:#8f8ff0; --diaper:#3cc4ba; --health:#efa840; --growth:#62bd72; --activity:#a986fa; --memory:#e07bbd;
  --danger:#f07070; --warn-bg:#3a2e14; --warn-ink:#f3cd84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171e29; --surface-2:#202a38; --line:#2c3747;
  --ink:#e8edf5; --ink-2:#a9b3c4; --ink-3:#768195;
  --accent:#8c9dff; --accent-ink:#0f141c; --accent-soft:#252f52; --tilemix:52%;
  --feed:#f08496; --sleep:#8f8ff0; --diaper:#3cc4ba; --health:#efa840; --growth:#62bd72; --activity:#a986fa; --memory:#e07bbd;
  --danger:#f07070; --warn-bg:#3a2e14; --warn-ink:#f3cd84; color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);text-align:left;color:var(--ink-2);font-weight:600}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--accent)}

/* log tile row */
.logrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:thin}
.lt{flex:0 0 auto;width:96px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;scroll-snap-align:start;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.lt .sq{width:96px;height:96px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) var(--tilemix),var(--surface));color:color-mix(in srgb,var(--c) 55%,var(--ink));transition:transform .12s ease}
.lt .sq svg{width:46px;height:46px;stroke-width:2.3}
.lt:hover .sq{transform:translateY(-2px)}
.lt:active .sq{transform:scale(.96)}
.lt.running .sq{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.lt:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){.lt .sq{transition:none}}
@media (max-width:820px){.logrow{gap:8px}.lt{width:calc((100% - 40px)/6);min-width:46px;font-size:11px;gap:5px}.lt>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lt .sq{width:100%;height:auto;aspect-ratio:1;border-radius:15px}.lt .sq svg{width:52%;height:52%}}

/* theme swatches */
.swatches{display:flex;flex-wrap:wrap;gap:14px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--ink-2);font-weight:600}
.sw{position:relative}
.sw input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.sw span{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--sw) 50%,var(--swd) 50%);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:6px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.th{display:flex;flex-direction:column;gap:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.th{position:relative}
.th input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.th .pv{display:grid;grid-template-columns:1fr 1fr;height:66px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.th .pv i{position:relative;display:block}
.th .pv i:first-child{background:var(--pl)}
.th .pv i:last-child{background:var(--dl)}
.th .pv i::before{content:"";position:absolute;left:9px;right:9px;top:11px;height:16px;border-radius:6px;background:var(--ps)}
.th .pv i:last-child::before{background:var(--ds)}
.th .pv i::after{content:"";position:absolute;left:9px;bottom:9px;width:20px;height:20px;border-radius:50%;background:var(--pa)}
.th .pv i:last-child::after{background:var(--da)}
.th .pv.custom i{background:conic-gradient(from 90deg,#f39a86,#f2c14e,#6fd3a8,#7dbcf0,#b89cf0,#f39a86)}
.th .pv.custom i::before,.th .pv.custom i::after{display:none}
.th input:checked + .pv{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.th input:focus-visible + .pv{outline:2px solid var(--accent);outline-offset:6px}
.th input:checked ~ .tn{color:var(--ink)}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:600;font-size:14px;cursor:pointer;background:var(--bg)}
.chk:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
/* icon styles */
.emo{display:inline-block;line-height:1;font-size:18px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.lt .sq .emo{font-size:44px}
@media (max-width:820px){.lt .sq .emo{font-size:28px}}
.st-soft svg *:not([fill="currentColor"]){fill:currentColor;fill-opacity:.22}
.st-chunky svg{stroke-width:3.1!important}
.sq.st-chunky,.mini.st-chunky{border-radius:50%!important}
.sq.st-bubble,.ic.st-bubble,.mini.st-bubble{background:var(--c)!important;color:var(--bg)!important}
.sq.st-bubble{border-radius:50%!important}
.sq.st-bubble svg{stroke-width:2.5}
.sq.st-emoji,.ic.st-emoji,.mini.st-emoji{background:color-mix(in srgb,var(--c) 20%,var(--surface))!important}
.icsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.ipv{display:flex;gap:6px;justify-content:center;align-items:center;height:66px;border-radius:14px;box-shadow:0 0 0 1px var(--line);background:var(--bg)}
.ipv .sq{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) var(--tilemix),var(--surface));color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.ipv .sq svg{width:19px;height:19px;stroke-width:2.2}
.ipv .sq .emo{font-size:17px}
.th input:checked + .ipv{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.th input:focus-visible + .ipv{outline:2px solid var(--accent);outline-offset:6px}
.askbar{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;color:var(--ink-3);font-size:15px;text-align:left}
.askbar:hover{border-color:var(--accent)}
.asklog{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:2px 0 8px}
.bub{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14.5px;line-height:1.5}
.bub p{margin:0 0 6px}.bub p:last-child{margin-bottom:0}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.bub.urgent{align-self:stretch;max-width:none;background:color-mix(in srgb,var(--danger) 14%,var(--surface));border:1px solid var(--danger)}
.bub.urgent b{color:var(--danger)}
.tagline{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:6px}
.srcs{font-size:12.5px}.srcs a{color:var(--accent)}
.botfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-3)}
.botfoot button{border:0;background:none;color:var(--ink-3);font-size:12px;display:inline-flex;align-items:center;gap:4px;padding:0}
.askform{display:flex;gap:8px;margin-top:8px}
.askform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pre{flex:1 1 0;min-width:64px;padding:10px 8px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--activity) 40%,var(--line));background:color-mix(in srgb,var(--activity) 8%,var(--surface));color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pre:hover{background:color-mix(in srgb,var(--activity) 16%,var(--surface))}
.pre.last{border-color:var(--activity);box-shadow:0 0 0 1px var(--activity)}
.pre:last-child{font-weight:600;color:var(--ink-2)}
.tdots{display:flex;gap:6px;margin:8px 0 2px}
.tdots i{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--activity) 45%,var(--line))}
.tdots i.on{background:var(--activity);border-color:var(--activity)}
.tdots i.opt{border-style:dashed}
.tlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.tlist button{border:0;background:color-mix(in srgb,var(--activity) 12%,transparent);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;cursor:pointer}
.tstart{margin-top:10px;max-width:420px}
.tstart .sub{font-size:12.5px;font-weight:600}
.acttimer .tsub{font-size:12.5px;margin-top:2px}
.cdbar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--activity) 15%,var(--surface));overflow:hidden;margin-top:8px;max-width:320px}
.cdbar i{display:block;height:100%;background:var(--activity);transition:width 1s linear}
.acttimer.up{background:color-mix(in srgb,var(--activity) 12%,var(--surface))}
.acttimer.up .t{color:var(--activity)}
.ttip{font-size:12.5px;color:var(--ink-2);margin-top:8px;max-width:360px}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.acttimer .tbtns{flex:1 1 100%;justify-content:flex-end}
.acttimer>div:first-child{flex:1 1 100%}
.tbars{display:inline-flex;gap:3px;margin-left:10px;vertical-align:middle}
.tbars i{width:16px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--activity) 20%,var(--surface))}
.tbars i.on{background:var(--activity)}
.tbars i.opt{background:none;border:1px dashed color-mix(in srgb,var(--activity) 50%,var(--line));height:4px}
.tlink{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;cursor:pointer}
.presets.sm{gap:6px;margin-top:8px;max-width:340px}
.presets.sm .pre{padding:6px 6px;font-size:13px;border-radius:99px;border-width:1px;min-width:0}
.tgoal{margin-top:8px;max-width:320px}
.tgoal .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--activity) 15%,var(--surface));overflow:hidden;margin-bottom:4px}
.tgoal .bar i{display:block;height:100%;background:var(--activity);border-radius:3px}
.asklog.page{max-height:none;min-height:180px}
.seg2{margin-bottom:4px}
.tabbar button[data-view="ask"] svg{width:36px;height:36px;padding:7px;margin-top:-8px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.mscheck{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mscheck input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.mscheck small{display:block;color:var(--ink-3);font-size:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
label.btn{cursor:pointer}
label.btn:has(+ .vh:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* arrange tiles */
.lt.arrange .sq{background:transparent;color:var(--ink-3);border:2px dashed var(--line)}
.arrlist{display:flex;flex-direction:column}
.arr{display:grid;grid-template-columns:20px 36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);background:var(--surface)}
.arr:last-child{border-bottom:0}
.arr .grip{color:var(--ink-3);cursor:grab;display:grid}
.arr .grip svg{width:18px;height:18px}
.arr .mini{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) var(--tilemix),var(--surface));color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.arr .mini svg{width:20px;height:20px;stroke-width:2.3}
.arr .nm{font-weight:600;min-width:0}
.arr.off .mini,.arr.off .nm{opacity:.4}
.arr .show{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.arr .mv{display:flex;gap:4px}
.arr .mv button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;padding:0}
.arr .mv button svg{width:16px;height:16px}
.arr .mv button:disabled{opacity:.35;cursor:default}
.arr.dragging{opacity:.4}
.arr.over{box-shadow:inset 0 3px 0 var(--accent)}
.rail .sync{margin-top:auto;font-size:12.5px;color:var(--ink-3);padding:8px 10px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--growth)}

main{min-width:0;overflow-x:clip;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:12px 16px;font-weight:500}
.banner .btn{background:var(--ink);color:var(--bg)}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:clamp(26px,4vw,34px)}
.sub{color:var(--ink-2);font-size:14px}
.age{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}

.btn{border:0;border-radius:99px;padding:9px 16px;font-weight:600;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}

.genough .gr{display:grid;grid-template-columns:26px minmax(0,1fr) 76px;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.genough h2+.gr{border-top:0}
.genough .gs{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;margin-top:1px}
.genough .gs svg{width:15px;height:15px;stroke-width:3}
.genough .gr.ok .gs{background:color-mix(in srgb,var(--diaper) 18%,transparent);color:var(--diaper)}
.genough .gr.warn .gs{background:var(--warn-bg);color:var(--warn-ink)}
.genough .gr.na .gs{background:var(--surface-2);color:var(--ink-3)}
.genough .gm b{font-weight:600;font-size:14.5px}
.genough .gn{font-size:12.5px;color:var(--ink-3)}
.genough .gv{text-align:right;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.genough .gr.warn .gv{color:var(--warn-ink)}
.gbar{position:relative;height:7px;border-radius:4px;background:var(--surface-2);margin-top:7px;max-width:420px}
.gbar i{position:absolute;top:0;height:7px;border-radius:4px;background:color-mix(in srgb,var(--diaper) 45%,var(--surface))}
.gbar b{position:absolute;top:-3px;width:3px;height:13px;border-radius:2px;background:var(--ink)}
.gt{font-size:12.5px;color:var(--warn-ink);margin-top:5px}
.gsum{margin:8px 0 0;padding:8px 10px;border-radius:10px;font-size:13.5px}
.gsum.warn{background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.trc{margin-bottom:14px}
.mc .chart text{font-size:10px}
.mc .chart text.avgl{fill:var(--ink-2);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
@media (min-width:821px){.mc .chart text{font-size:9px}}
.insp .ins{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.insp h2+.ins{border-top:0}
.insp .ii{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.insp .ii svg{width:17px;height:17px}
.mc .mch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mc .mct{font-size:13px;font-weight:700;color:var(--ink-2)}
.dpill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.mc .mcb{margin:4px 0 6px}
.mc .mcb b{font-family:var(--display);font-size:28px;font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.mc .mcb span{font-size:13px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}

/* since-last tiles */
.since{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c)}
.tile .big{font-family:var(--display);font-size:clamp(20px,3vw,28px);font-weight:700;font-variant-numeric:tabular-nums}
.tile .meta{color:var(--ink-2);font-size:13px}
.linkb{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;cursor:pointer}

/* timers */
.timers{display:flex;flex-direction:column;gap:12px}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:14px 16px}
.timer .t{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer .sides{display:flex;gap:8px}
.side{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;min-width:92px;text-align:left}
.side small{display:block;color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.06em}
.side span{font-weight:700;font-variant-numeric:tabular-nums}
.side.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* nap prediction */
.cus{display:flex;flex-direction:column}
.cu{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.cu:first-child{padding-top:0}
.cu:last-child{border-bottom:0;padding-bottom:4px}
.cu[data-edit]{cursor:pointer}
.cu .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.cu .ic svg{width:18px;height:18px}
.cu .cx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.cu b{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25}
.cu .sub{font-size:13px}
.cu .btn{margin-top:6px}
.up .bar{height:10px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden;margin:10px 0 6px}
.up .bar i{position:absolute;inset:0 auto 0 0;background:var(--sleep);border-radius:99px}
.up .bar b{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sleep) 30%,transparent)}
.nap .when{font-family:var(--display);font-size:22px;font-weight:700}

/* quick log */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.q{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--ink)}
.q:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.q .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.q .ic svg{width:21px;height:21px}

/* summary stats */
.vitals{display:flex;gap:0;background:transparent;border:0;border-radius:10px;padding:2px 0;font:inherit;color:inherit;text-align:left}
.vitals .vt{display:flex;flex-direction:column;padding:0 10px;border-left:1px solid var(--line);min-width:0}
.vitals .vt:first-child{border-left:0}
.vitals small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.vitals b{font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.vitals:hover b{color:var(--ink)}
:root{--fbar:#3f86d6;--fbar2:#8fbcf0;--solidc:#e39a2d;--poo:#b7791f}
:root[data-theme="dark"]{--fbar:#7db4ee;--fbar2:#3d6fa8;--solidc:#f2b45a;--poo:#d9a050}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fbar:#7db4ee;--fbar2:#3d6fa8;--solidc:#f2b45a;--poo:#d9a050}}
.rnow h2{margin-bottom:4px}
.rnow .chips .chip{padding:4px 12px}
.rn{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;row-gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rn:last-of-type{border-bottom:0}
.ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--ink));grid-row:1}
.ri svg{width:22px;height:22px}.ri .emo{font-size:20px}
.rm{display:flex;flex-direction:column;gap:1px;min-width:0}
.rl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.rt{font-weight:600;font-size:14.5px}
.rs{font-size:12.5px;color:var(--ink-2)}
.rv{text-align:right;display:flex;flex-direction:column;align-self:start}
.rv b{font-family:var(--display);font-size:24px;line-height:1.1;color:color-mix(in srgb,var(--c) 60%,var(--ink))}
.ln{grid-column:2 / 4;position:relative;height:16px;border-radius:6px;background:color-mix(in srgb,var(--c) 12%,var(--surface));overflow:hidden}
.ln .nt{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sleep) 14%,transparent)}
.ln.tall{height:26px}
.ln .tk{position:absolute;top:3px;bottom:3px;width:4px;margin-left:-2px;border-radius:2px}
.ln .sg{position:absolute;top:3px;bottom:3px;border-radius:3px}
.ln .sg.low{top:auto;height:5px;bottom:2px;background:var(--fbar2)}
.ln .mb{position:absolute;bottom:2px;width:6px;margin-left:-3px;border-radius:3px 3px 1px 1px;background:var(--fbar)}
.ln .nw{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.rax{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px}
.rax .hours{margin-top:0}
.rleg{margin-top:8px;font-size:12px}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gl{background:none;border:0;border-left:3px solid var(--c);text-align:left;font:inherit;color:inherit;padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.gl[data-view]{cursor:pointer}
.gl b{font-family:var(--display);font-size:20px;line-height:1.2}
.gl .sub{font-size:12.5px}
.chg{white-space:nowrap}
.strip.typ .lay{position:absolute;inset:0}
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.sum b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.sum span{color:var(--ink-2);font-size:13px}

/* 24h strip */
.strip{position:relative;height:30px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.strip .seg{position:absolute;top:0;bottom:0;border-radius:3px}
.strip .tick{position:absolute;top:4px;bottom:4px;width:3px;border-radius:2px}
.hours{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.days{display:flex;flex-direction:column;gap:8px}
.dcard{padding:12px 16px}
.dcard.open{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.dname{font-family:var(--display);font-weight:700;font-size:17px}
.chev{color:var(--ink-3);font-size:13px}
.dnums{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px;font-size:13.5px;color:var(--ink-2)}
.dnums b{color:var(--ink);font-weight:700}
.mst{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.mst.tall{height:18px}
.mst i{position:absolute;top:2px;bottom:2px;width:3px;margin-left:-1.5px;border-radius:2px}
.mst u{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sleep) 30%,transparent)}
.mst b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.dcard .chips.scroll{margin:12px 0 4px}
.wk{padding:6px 12px 10px}
.wkt{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.wkt th,.wkt td{padding:9px 4px;text-align:right;font-size:14.5px}
.wkt thead th{font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 4px 6px}
.wkt th:first-child{text-align:left;width:34%}
.wkt th,.wkt td{border:0}
.wkt tbody th{font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.wkt thead th{text-transform:none;letter-spacing:0}
.wkt tbody th small{font-weight:500;color:var(--ink-3);font-size:11.5px}
.wkt tbody tr{border-top:1px solid var(--line);cursor:pointer}
.wkt tbody tr:hover{background:var(--surface-2)}
.wkt tbody tr.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.wkt tbody tr.sel th{color:var(--accent)}
.wkt tr.avg{cursor:default;color:var(--ink-3)}
.wkt tr.thin td{color:var(--ink-3)}
.wkt tr.thin small{font-style:italic}
.wkn{display:flex;flex-direction:column;gap:2px}
.wkt tr.avg:hover{background:none}
.wkt tr.avg th{font-weight:500;font-size:13px;color:var(--ink-3)}
.hv{display:inline-block;min-width:26px;padding:1px 6px;border-radius:7px;text-align:center}
.hv.lo{background:var(--warn-bg);color:var(--warn-ink);font-weight:700}
.wkf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px}
.wkf .hv{min-width:0;padding:0 5px;font-size:11px}
.dday{padding:14px 16px}
.ddh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ddh h2{margin:0}
.ddn{display:flex;gap:4px}
.ddn .btn{min-width:36px;font-size:18px;line-height:1}
.dps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.dp{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--pc) 15%,transparent);color:color-mix(in srgb,var(--pc) 70%,var(--ink))}
.dday .chips.scroll{margin:10px 0 2px}
.eg{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 2px}
.erow{display:grid;grid-template-columns:66px 10px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;padding:7px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;font-size:14px;line-height:1.35}
.erow:hover{background:var(--surface-2)}
.erow .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.erow .edot{width:9px;height:9px;border-radius:50%;background:var(--dc);align-self:center}
.erow .et{min-width:0;overflow-wrap:anywhere}
.erow .et b{font-weight:600}
.erow .et>span:not(.newp):not(.pend){color:var(--ink-2)}
.erow .by2{display:inline;color:var(--ink-3)}
.erow.tu .tm{color:var(--ink-3);font-weight:500}
.erow.tu .edot{width:6px;height:6px;opacity:.7}
.erow .tut{color:var(--ink-3);font-size:12.5px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.tyl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dayrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.dayrow .dl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dayrow.sel .dl{color:var(--accent)}
.dayrow button.strip{border:0;padding:0;width:100%;text-align:left}
.dayrow.sel .strip{outline:2px solid var(--accent);outline-offset:1px}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* entries list */
.list{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:62px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.entry:last-child{border-bottom:0}
.entry:hover{background:var(--surface-2)}
.entry .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.entry .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.entry .ic svg{width:17px;height:17px}
.entry .tx{min-width:0}
.entry .tx b{font-weight:600}
.away{border-left:4px solid var(--accent)}
.awayl{margin:0;font-weight:600;font-size:15px}
.awlist{list-style:none;margin:0;padding:0}
.awlist li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.awlist li:first-child{border-top:0}
.aw{font-size:12.5px;color:var(--ink-2);font-weight:600}
.newp{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);vertical-align:2px;margin-left:6px}
.by2{display:none}
.by2:not(:empty)::before{content:' · by '}
@media (max-width:820px){.by2{display:inline;color:var(--ink-3)}}
.pend{font-size:11.5px;font-weight:600;color:var(--warn-ink)}
.offbar{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:8px 14px;font-size:13.5px;font-weight:600}
.entry .tx div{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.entry .by{font-size:12px;color:var(--ink-3);text-align:right}
.empty{color:var(--ink-3);padding:18px 4px;text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .val{fill:var(--ink-2);font-weight:600}
.chartwrap{overflow-x:auto}

/* teeth */
.htabs{margin-bottom:14px}
.htabs{flex-wrap:nowrap}
.htabs .chip{padding:6.2px 14.9px;font-size:16.1px;white-space:nowrap}
@media (max-width:820px){.htabs .chip{flex:1 1 auto;padding:6.2px 8px}}
@media (max-width:390px){.htabs{gap:6px}.htabs .chip{font-size:14.5px;padding:6.2px 6px}}
.chip.sm2{padding:6px 12px;font-size:13.5px}
.hsums{margin-top:12px}
.sum.hs{border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.sum.hs b{font-size:16px}
.nxt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit;padding:8px 0;border-bottom:1px solid var(--line)}
button.nxt{cursor:pointer}
.nxt .ii{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:none}
.nxt .ii svg{width:19px;height:19px}
.nxt>span:last-child{display:flex;flex-direction:column}
.nxt b{font-weight:600}
.nxt>span:last-child>span{font-size:13px;color:var(--ink-3)}
.sched{display:flex;flex-direction:column}
.sr2{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.sr2>span:last-child{display:flex;flex-direction:column}
.sr2 b{font-weight:600;font-size:14.5px}
.sr2>span:last-child>span{font-size:12.5px;color:var(--ink-3)}
.sr2.done .nbc{background:var(--diaper);border-color:var(--diaper)}
.sr2.done b{color:var(--ink-2)}
.sr2.next .nbc{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.sr2.next b{color:var(--accent)}
.coll{cursor:pointer;user-select:none}
.coll .chev{font-size:14px;color:var(--ink-3)}
.panel.shut h2{margin-bottom:0}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 8px}
.nbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.nbi{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;font:inherit;color:inherit;cursor:pointer}
.nbi:disabled{cursor:default;opacity:1}
.nbc{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2,var(--line));display:grid;place-items:center;color:#fff}
.nbi.on .nbc{background:var(--diaper);border-color:var(--diaper)}
.nbc svg{width:15px;height:15px;stroke-width:3}
.nbt{display:flex;flex-direction:column;min-width:0}
.nbt b{font-weight:600;font-size:14.5px}
.nbt span{font-size:12.5px;color:var(--ink-3)}
.nbi.on .nbt b{color:var(--ink-2)}
.wrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrow .wb{flex:1 1 140px;min-width:0}
.wrow .wb.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrow .segs{flex:none;margin:0}
.wrow>.field{flex:none;margin:0;gap:0}
.wrow>.field>span:empty{display:none}
.uin{position:relative;display:block}
.uin span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px;pointer-events:none}
.uin input{padding-right:34px}
#wconv{margin-top:4px;min-height:1em}
.teeth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.mouth{width:100%;max-width:340px;margin:0 auto;display:block}
.mouth .tooth{cursor:pointer}
.mouth .tooth path{fill:var(--surface-2);stroke:var(--ink-3);stroke-width:1.2}
.mouth .tooth.on path{fill:var(--health);stroke:var(--health)}
.mouth .tooth:hover path{stroke:var(--ink);stroke-width:2}
.mouth text{fill:var(--ink-3);font-size:10px;font-family:var(--body);font-weight:700;letter-spacing:.06em}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:640px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{border-radius:18px}}
.modal h3{font-size:21px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal h3 .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.modal h3 .ic svg{width:19px;height:19px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs label{flex:1 1 auto;position:relative}
.segs input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.segs span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:600;font-size:14px;cursor:pointer;background:var(--bg)}
.segs input:checked + span{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));color:var(--ink)}
.segs input:focus-visible + span{outline:2px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:6px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.confirm{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

.stash-empty{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px}
.ssum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ssum>div:first-child{display:flex;flex-direction:column}
.ssum b{font-family:var(--display);font-size:24px;line-height:1.1}
.schips{display:flex;gap:6px;flex-wrap:wrap}
.schip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--feed)) 14%,var(--surface));color:color-mix(in srgb,var(--c,var(--feed)) 70%,var(--ink))}
.sc-fridge{--c:var(--fbar)}.sc-thawed{--c:var(--activity)}.sc-freezer{--c:#3aa7c7}
.snext{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--feed) 9%,var(--surface))}
.snext>div{display:flex;flex-direction:column;gap:1px}
.spast{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--danger)}
.stog{margin-top:10px;border:0;background:none;padding:4px 0;font-weight:600;color:var(--accent);font-size:14px}
.slist{display:flex;flex-direction:column;margin-top:4px}
.sr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;font:inherit;color:inherit}
.sr:last-child{border-bottom:0}
.sr b{font-family:var(--display);font-size:16px}
.srm{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sru{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.sr.soon .sru{color:var(--warn-ink);font-weight:600}.sr.past .sru{color:var(--danger);font-weight:700}
.stot{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:8px;background:color-mix(in srgb,var(--feed) 9%,var(--surface));border-radius:12px;padding:10px 12px;margin-bottom:6px}
.stot>div{display:flex;flex-direction:column;min-width:0}
.stot b{font-family:var(--display);font-size:17px}
.stot .st0 b{font-size:24px}
.sx{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sx:last-of-type{border-bottom:0}
.sxm{display:flex;flex-direction:column;min-width:0}
.sxm b{font-family:var(--display);font-size:18px}
.sxb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sx.soon .sxm .sub:last-child{color:var(--warn-ink);font-weight:600}
.sx.past .sxm .sub:last-child{color:var(--danger);font-weight:600}
.toast.undo{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
.toast.undo button{border:0;border-radius:99px;padding:6px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;font-size:14px}
.note{font-size:12.5px;color:var(--ink-3)}

/* mobile */
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink-3);padding:4px 6px;flex:1}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .since{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tile{padding:10px 10px}
  .teeth{grid-template-columns:minmax(0,1fr)}
  .entry{grid-template-columns:64px 32px minmax(0,1fr);gap:10px}
  .entry .tm{white-space:nowrap;font-size:13px}
  .entry .by{display:none}
}

/* family + invites */
.mem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);font-weight:700;flex:none}
.mem .mn{display:flex;flex-direction:column;min-width:0;flex:1}
.mem .mn span{font-size:12.5px;color:var(--ink-2)}
.invite{background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.invite .code{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.invite .row{display:flex;gap:8px}
.invite input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:13px}
.field select{appearance:auto}
</style>
</head>

/* ---------- icons ---------- */

};
const EMOJI={breast:'🤱',bottle:'🍼',solids:'🥣',pump:'🥛',sleep:'😴',diaper:'🧷',potty:'🚽',ruler:'📏',temp:'🌡️',med:'💊',symptom:'🤒',doctor:'🩺',vaccine:'💉',activity:'🧸',tummy:'👶',spit:'🤮',vitd:'💧',drop:'💧',note:'⭐',tooth:'🦷',heart:'❤️',sun:'☀️'};

/* ---------- time + units ---------- */
const MIN=60000, HR=3600000, DAY=86400000;
const pad = n => String(n).padStart(2,'0');
const dayKey = ms => { const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

const fmtClock = ms => { ms=Math.max(0,ms); const h=Math.floor(ms/HR), m=Math.floor(ms%HR/MIN), s=Math.floor(ms%MIN/1000); return (h?h+':':'')+pad(m)+':'+pad(s); };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const U = {

  volAs(ml,u){ if(ml==null) return ''; return u==='oz' ? `${+(ml/29.5735).toFixed(1)} oz` : `${Math.round(ml)} ml`; },
  volTo(ml,u){ if(ml==null) return ''; return u==='oz' ? +(ml/29.5735).toFixed(1) : Math.round(ml); },
  volFrom(v,u){ return v===''||v==null||isNaN(v) ? null : (u==='oz' ? +v*29.5735 : +v); },
  volIn(v){ return v===''||v==null||isNaN(v)?null: U.imp()? +v*29.5735 : +v; },
  volOut(ml){ return ml==null?'': U.imp()? +(ml/29.5735).toFixed(1) : Math.round(ml); },
  volU(){ return U.imp()?'oz':'ml'; },
  wt(kg){ if(kg==null) return ''; if(!U.imp()) return `${kg.toFixed(2)} kg`; const oz=kg*35.274; return `${Math.floor(oz/16)} lb ${Math.round(oz%16)} oz`; },
  wtIn(v){ return v===''||v==null||isNaN(v)?null: U.imp()? +v/2.20462 : +v; },
  wtOut(kg){ return kg==null?'': U.imp()? +(kg*2.20462).toFixed(2) : +kg.toFixed(2); },
  wtU(){ return U.imp()?'lb':'kg'; },
  len(cm){ return cm==null?'': U.imp()? `${(cm/2.54).toFixed(1)} in` : `${cm.toFixed(1)} cm`; },
  lenIn(v){ return v===''||v==null||isNaN(v)?null: U.imp()? +v*2.54 : +v; },
  lenOut(cm){ return cm==null?'': U.imp()? +(cm/2.54).toFixed(1) : +cm.toFixed(1); },
  lenU(){ return U.imp()?'in':'cm'; },
  tmp(c){ return c==null?'': U.imp()? `${(c*9/5+32).toFixed(1)} °F` : `${c.toFixed(1)} °C`; },
  tmpIn(v){ return v===''||v==null||isNaN(v)?null: U.imp()? (+v-32)*5/9 : +v; },
  tmpOut(c){ return c==null?'': U.imp()? +(c*9/5+32).toFixed(1) : +c.toFixed(1); },
  tmpU(){ return U.imp()?'°F':'°C'; }
};

function ageText(birth, at=Date.now()){
  if(!birth) return '';
  const b=new Date(birth+'T00:00'), n=new Date(at);
  const days=Math.round((startOfDay(at)-b.getTime())/DAY);
  if(days<0) return 'Due soon';
  if(days<14) return `${days} day${days===1?'':'s'}`;
  if(days<91) return `${Math.floor(days/7)} wk ${days%7} d`;
  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth()); if(n.getDate()<b.getDate()) m--;
  const anchor=new Date(b); anchor.setMonth(b.getMonth()+m);
  const w=Math.floor((n-anchor)/DAY/7);
  if(m<24) return `${m} mo${w?` ${w} wk`:''}`;
  return `${Math.floor(m/12)} yr ${m%12} mo`;
}
const ageDays = (birth, at=Date.now()) => birth ? (at-new Date(birth+'T00:00').getTime())/DAY : null;

function breastTotals(e, now=Date.now()){
  let L=e.left||0, R=e.right||0;
  if(e.active && e.activeSince && e.end==null){ const d=now-e.activeSince; if(e.active==='L') L+=d; else R+=d; }
  return {L,R,total:L+R};
}
function entrySummary(e){
  switch(e.type){
    case 'breast': { const t=breastTotals(e); const parts=[]; if(t.L) parts.push(`L ${fmtDur(t.L)}`); if(t.R) parts.push(`R ${fmtDur(t.R)}`); return (e.end==null?'In progress · ':'')+(parts.join(' · ')||'—'); }
    case 'bottle': return [e.amount==null?'':U.vol(e.amount)+(e.volUnit && e.volUnit!==(U.imp()?'oz':'ml') ? ` (${U.volAs(e.amount,e.volUnit)})` : ''), e.contents==='formula'?'Formula':e.contents==='breastmilk'?'Breast milk':''].filter(Boolean).join(' · ');
    case 'solids': return [e.food, e.amountText, e.reaction && e.reaction!=='neutral' ? ({liked:'Liked it',disliked:'Disliked',reaction:'⚠ Reaction'}[e.reaction]) : ''].filter(Boolean).join(' · ');
    case 'pump': { const vu=U.imp()?'oz':'ml'; return [e.left!=null?`L ${U.volAs(e.left,vu)}`:'', e.right!=null?`R ${U.volAs(e.right,vu)}`:'', (e.left||0)+(e.right||0)?`Total ${U.volAs((e.left||0)+(e.right||0),vu)}`:'', e.duration?`${e.duration} min`:'', {fed:'fed now',fridge:'fridge',freezer:'freezer'}[e.store]||'', e.usedAt?'used':e.tossedAt?'tossed':e.thawedAt?'thawed':''].filter(Boolean).join(' · '); }
    case 'sleep': return e.end==null ? `Asleep · ${fmtDur(Date.now()-e.start)}` : `${fmtDur(e.end-e.start)} · until ${fmtTime(e.end)}${e.kind==='night'?' · Night':''}`;
    case 'diaper': { const pc=POO_COLORS.find(c=>c[0]===e.pcolor), AP={small:'light',medium:'medium',large:'heavy'}, AD={small:'little',medium:'medium',large:'big'};
      const wetT='Wet'+(e.pee?` (${AP[e.pee]})`:''), dirT=(e.kind==='mixed'?'dirty':'Dirty')+(e.poo?` (${AD[e.poo]})`:'');
      return [({wet:wetT,dirty:dirT,mixed:wetT+' + '+dirT,dry:'Dry'}[e.kind]||''),
        pc?pc[1].toLowerCase():'', e.cons?{seedy:'seedy',soft:'soft',runny:'runny',firm:'firm',mucus:'mucus'}[e.cons]:'', e.rash?'Diaper rash':'', e.color||''].filter(Boolean).join(' · '); }
    case 'potty': return ({pee:'Pee',poo:'Poo',both:'Pee + poo',none:'Tried, nothing'}[e.result]||'');
    case 'growth': return [e.weight!=null?U.wt(e.weight):'', e.length!=null?U.len(e.length):'', e.head!=null?`Head ${U.len(e.head)}`:'', e.belly!=null?`Belly ${U.len(e.belly)}`:'', e.chest!=null?`Chest ${U.len(e.chest)}`:''].filter(Boolean).join(' · ');
    case 'vitals': return [e.hr?`Heart ${e.hr} bpm`:'', e.rr?`Breathing ${e.rr}/min`:'', e.spo2?`Oxygen ${e.spo2}%`:'', e.sys?`BP ${e.sys}${e.dia?'/'+e.dia:''} mmHg`:'', e.state?{asleep:'asleep',calm:'calm',crying:'crying'}[e.state]:''].filter(Boolean).join(' · ');
    case 'jaundice': return [e.bili!=null?`Bilirubin ${e.bili} mg/dL`:'', e.where?(e.where==='none'?'No yellow':'Yellow to '+({face:'face',chest:'chest',belly:'belly',legs:'legs',soles:'palms/soles'}[e.where]||e.where)):'', e.method?({look:'skin check',tcb:'skin meter',blood:'blood test'}[e.method]):''].filter(Boolean).join(' · ');
    case 'temp': return U.tmp(e.value)+(e.value!=null && e.value>=37.995 ? ' · Fever' : '');
    case 'med': return [e.name, e.dose].filter(Boolean).join(' · ');
    case 'vaccine': return e.name||'';
    case 'activity': return e.end===null ? `${e.kind||'Activity'} · in progress` : [e.kind, e.duration?`${e.duration} min`:''].filter(Boolean).join(' · ');
    case 'note': return (e.milestone?'Milestone · ':'')+(e.title||'');
    case 'spit': return [e.kind==='vomit'?'Vomit':'Spit-up', e.amount==='lot'?'a lot':e.amount==='little'?'a little':'', e.forceful?'forceful':'', {milky:'milky',yellow:'yellow',green:'green',bloody:'blood in it',brown:'dark brown'}[e.scolor]||''].filter(Boolean).join(' · ');
    case 'vitd': return 'Given';
    case 'doctor': return (e.start>Date.now()?'Upcoming · ':'')+(e.title||'');
    default: return '';
  }
}

function sampleData(){
  const now=Date.now(), birth=new Date(now-214*DAY); const bs=`${birth.getFullYear()}-${pad(birth.getMonth()+1)}-${pad(birth.getDate())}`;
  const E=[]; let id=0; const add=o=>E.push({id:'s'+(id++),...o});
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280; return seed/233280;};
  for(let d=13; d>=0; d--){
    const base=startOfDay(now)-d*DAY;
    const at=(h,m=0)=>base+h*HR+m*MIN+Math.round((rnd()-.5)*20)*MIN;
    // night sleep from previous evening is logged on that day; this day: wake ~6:45
    const naps=[[9,15,70],[13,0,85],[16,40,40]];
    naps.forEach(([h,m,dur])=>{ const s=at(h,m); if(s<now) add({type:'sleep',kind:'nap',start:s,end:Math.min(now,s+(dur+Math.round(rnd()*20-10))*MIN)}); });
    const ns=at(19,30); if(ns<now) add({type:'sleep',kind:'night',start:ns,end:Math.min(now, ns+11*HR+Math.round(rnd()*40)*MIN)});
    [[6,50],[10,45],[14,40],[18,50]].forEach(([h,m],i)=>{ const s=at(h,m); if(s>now) return;
      if(i%2===0){ const l=(7+Math.round(rnd()*6))*MIN, r=(6+Math.round(rnd()*6))*MIN; add({type:'breast',start:s,end:s+l+r,left:l,right:r,active:null}); }
      else add({type:'bottle',start:s,amount:150+Math.round(rnd()*4)*15,contents: rnd()>.5?'breastmilk':'formula'}); });
    [[8,0,'Oatmeal + banana'],[12,15,'Sweet potato'],[17,30,'Peas + avocado']].forEach(([h,m,f])=>{ const s=at(h,m); if(s<now) add({type:'solids',start:s,food:f,amountText:['2 tbsp','3 tbsp','¼ cup'][Math.floor(rnd()*3)],reaction:rnd()>.75?'disliked':'liked'}); });
    [7,10,13,16,19].forEach((h,i)=>{ const s=at(h,20); if(s<now) add({type:'diaper',start:s,kind: i===1||i===3&&rnd()>.5?'mixed':(rnd()>.8?'dirty':'wet')}); });
    const p=at(21,30); if(p<now) add({type:'pump',start:p,left:90+Math.round(rnd()*30),right:80+Math.round(rnd()*30),duration:15});
    const tt=at(11,0); if(tt<now && d%2===0) add({type:'activity',start:tt,kind:'Tummy time',duration:15});
    const bt=at(18,15); if(bt<now && d%2===1) add({type:'activity',start:bt,kind:'Bath',duration:20});
  }
  const g=[[0,3.4,50.5,34.5],[14,3.6,52,35.5],[33,4.5,55,37],[62,5.6,58.5,39],[122,7.0,63.5,41.5],[183,7.9,67,43.2]];
  g.forEach(([dd,w,l,h])=>add({type:'growth',start:birth.getTime()+dd*DAY+10*HR,weight:w,length:l,head:h}));
  add({type:'vaccine',start:birth.getTime()+183*DAY+10.5*HR,name:'6-month vaccines'});
  add({type:'doctor',start:birth.getTime()+183*DAY+10*HR,note:'6-month checkup. Growing well.'});
  add({type:'temp',start:now-3*DAY+2*HR,value:37.9});
  add({type:'med',start:now-3*DAY+2.2*HR,name:'Infant acetaminophen',dose:'as directed'});
  add({type:'note',start:now-5*DAY,title:'Sat up without support!',milestone:true});
  add({type:'note',start:now-20*DAY,title:'First tooth showed up',milestone:true});
  return {profile:{name:'Sample baby',birth:bs,sex:'f',units:'imperial'}, entries:E.sort((a,b)=>b.start-a.start),
    teeth:{lci_l:{date:dayKey(now-20*DAY)}, lci_r:{date:dayKey(now-9*DAY)}}};
}

const cloud = {
  async add(e){
    const id=e.id||newId(), ent={...e,id,by:e.by||uid()}; delete ent._pending; upsertLocal(ent);
    const queue=()=>{ outbox.push({op:'add',id,row:toRow(ent)}); upsertLocal({...ent,_pending:true}); queuedNow=true; };
    if(!navigator.onLine || outbox.get().length){ queue(); flushOutbox(); return id; }
    try{ must(await sb.from('entries').insert(toRow(ent))); }catch(err){ if(isNetErr(err)){ queue(); return id; } removeLocal(id); throw err; }
    return id;
  },
  async update(id, patch){
    const cur=state.entries.find(x=>x.id===id); if(!cur) return;
    const next={...cur,...patch}; delete next._pending; upsertLocal(next);
    const r=toRow(next);
    const queue=()=>{ outbox.push({op:'update',id,row:r}); upsertLocal({...next,_pending:true}); queuedNow=true; };
    if(!navigator.onLine || outbox.get().length){ queue(); flushOutbox(); return; }
    try{ must(await sb.from('entries').update({type:r.type,start_ms:r.start_ms,end_ms:r.end_ms,data:r.data}).eq('baby_id',baby.id).eq('id',id)); }
    catch(err){ if(isNetErr(err)){ queue(); return; } upsertLocal(cur); throw err; }
  },
  async del(id){
    const cur=state.entries.find(x=>x.id===id); removeLocal(id);
    const queue=()=>{ outbox.push({op:'del',id}); queuedNow=true; };
    if(!navigator.onLine || outbox.get().length){ queue(); flushOutbox(); return; }
    try{ must(await sb.from('entries').delete().eq('baby_id',baby.id).eq('id',id)); }catch(err){ if(isNetErr(err)){ queue(); return; } if(cur) upsertLocal(cur); throw err; }
  },
  async setProfile(p){
    const prev=state.profile; state.profile=p; render();
    try{ must(await sb.from('babies').update({name:p.name,birth:p.birth,sex:p.sex||'u',units:p.units||'imperial'}).eq('id',baby.id)); }
    catch(err){ state.profile=prev; render(); throw err; }
  },
  async setTeeth(t){
    const prev=state.teeth; state.teeth=t; render();

/* ---------- offline: keep changes on the phone and send them later ---------- */
const OKEY=id=>'nestling.outbox.'+id, CKEY=id=>'nestling.cache.'+id;
let queuedNow=false, flushing=false;
const outbox={
  get(){ if(!baby) return []; try{ return JSON.parse(localStorage.getItem(OKEY(baby.id))||'[]'); }catch(e){ return []; } },
  set(q){ if(!baby) return; try{ if(q.length) localStorage.setItem(OKEY(baby.id),JSON.stringify(q)); else localStorage.removeItem(OKEY(baby.id)); }catch(e){} renderNav(); },
  push(op){
    let q=this.get();
    if(op.op==='update'){ const a=q.find(x=>x.id===op.id && x.op==='add'); if(a){ a.row=op.row; this.set(q); return; } q=q.filter(x=>!(x.id===op.id && x.op==='update')); }
    if(op.op==='del'){ const had=q.some(x=>x.id===op.id && x.op==='add'); q=q.filter(x=>x.id!==op.id); if(had){ this.set(q); return; } }
    q.push(op); this.set(q);
  }
};
const isNetErr = err => !navigator.onLine || err instanceof TypeError || /fetch|network|load failed|timeout|offline/i.test(String(err?.message||err||''));
function withOutbox(list){
  const q=outbox.get(); if(!q.length) return list;
  let es=[...list];
  q.forEach(o=>{ if(o.op==='del') es=es.filter(e=>e.id!==o.id); else { const e={...fromRow({...o.row,created_by:uid()}),_pending:true}; const i=es.findIndex(x=>x.id===o.id); if(i>=0) es[i]=e; else es.push(e); } });
  return es.sort((a,b)=>b.start-a.start);
}
async function flushOutbox(){
  if(flushing || !sb || !baby || !navigator.onLine) return;
  let q=outbox.get(); if(!q.length) return;
  flushing=true; let sent=0;
  try{
    while(q.length){
      const o=q[0];
      try{
        if(o.op==='add'){ const {error}=await sb.from('entries').insert(o.row); if(error && error.code!=='23505') throw error; if(error) must(await sb.from('entries').update({type:o.row.type,start_ms:o.row.start_ms,end_ms:o.row.end_ms,data:o.row.data}).eq('baby_id',baby.id).eq('id',o.id)); }
        else if(o.op==='update') must(await sb.from('entries').update({type:o.row.type,start_ms:o.row.start_ms,end_ms:o.row.end_ms,data:o.row.data}).eq('baby_id',baby.id).eq('id',o.id));
        else must(await sb.from('entries').delete().eq('baby_id',baby.id).eq('id',o.id));
      }catch(err){ if(isNetErr(err)) break; toast(isDenied(err)?'You have view-only access, so an offline change was dropped.':'One offline change couldn’t be synced and was dropped.'); }
      q.shift(); outbox.set(q); sent++;
      const e=state.entries.find(x=>x.id===o.id); if(e && e._pending && !q.some(x=>x.id===o.id)){ delete e._pending; }
    }
  } finally { flushing=false; }
  if(sent){ softRender(); if(!q.length) toast('Offline changes synced'); }
}

async function safe(fn, okMsg){
  queuedNow=false;

function wakeWindow(days){
  // Typical awake time between sleeps, in minutes, by age in weeks.
  // Cross-checked against Cleveland Clinic (pediatrician-reviewed) and The Sleep Lady charts.
  const w=days/7;
  if(w<3)   return [20,45];    // first 3 weeks
  if(w<6)   return [30,60];    // 3–6 weeks
  if(w<9)   return [45,75];    // 6–9 weeks
  if(w<13)  return [60,90];    // 2–3 months
  if(w<17)  return [75,150];   // 3–4 months
  if(w<22)  return [90,150];   // 4–5 months
  if(w<30)  return [120,180];  // 5–7 months
  if(w<43)  return [150,210];  // 7–10 months
  if(w<52)  return [180,240];  // 10–12 months
  if(w<65)  return [180,300];  // 12–15 months
  if(w<104) return [240,360];  // 15–24 months
  return [300,360];            // 2 years+
}

const FUTURE_OK=['doctor','vaccine'];           // appointments can be scheduled ahead
const isFuture = (e, now=Date.now()) => !FUTURE_OK.includes(e.type) && e.start > now + 2*MIN;
const past = () => { const now=Date.now(); return state.entries.filter(e=>!isFuture(e,now)); };
function napPrediction(){
  const days=ageDays(state.profile?.birth); if(days==null) return null;
  const now=Date.now(), sleeps=past().filter(e=>e.type==='sleep');
  const active=sleeps.find(e=>e.end==null); if(active) return {asleep:true, since:active.start};
  const last=sleeps.filter(e=>e.end!=null && e.end<=now+2*MIN).sort((a,b)=>b.end-a.end)[0]; if(!last) return null;
  if(now-last.end > 12*HR) return {stale:true, lastEnd:last.end};
  const [a,b]=wakeWindow(days);
  return {asleep:false, awakeSince:last.end, from:last.end+a*MIN, to:last.end+b*MIN, a, b};
}

    return `<div class="bub bot"><span class="tagline">${svg('spark','width="14" height="14"')} Using ${esc(state.profile?.name||'baby')}’s log</span>${fmtAnswer(m.text)}

  }).join('');

async function askSend(q, forceAI){
  q=(q||'').trim(); if(!q) return;
  if(!forceAI) state.ask.push({kind:'me',text:q});
  const u=askUrgent(q); if(u){ state.ask.push({kind:'urgent',...u}); renderAsk(); return; }
  const f=!forceAI&&faqMatch(q);
  if(f){ state.ask.push({kind:'faq',f,q}); renderAsk(); return; }
  if(!aiReady()){ state.ask.push({kind:'error',text:'Personal answers need you to be signed in. Common questions about feeding, diapers, poop colors, fever, naps, checkups, teeth and growth work without signing in.'}); renderAsk(); return; }
  state.ask.push({kind:'thinking'}); renderAsk();
  try{
    const r=await askAI(q); state.ask=state.ask.filter(m=>m.kind!=='thinking');
    if(r.urgent) state.ask.push({kind:'urgent',level:r.urgent,text:r.answer});
    else state.ask.push({kind:'ai',text:(r.answer||'').trim()||'I couldn’t come up with an answer. Try asking another way.',q,remaining:r.remaining});
  }catch(err){
    state.ask=state.ask.filter(m=>m.kind!=='thinking');
    const s=err?.status;
    state.ask.push({kind:'error',text: s===429 ? (err.msg||'You’ve used today’s questions. They reset at midnight.') : s===404 || s==='unavailable' ? 'Personal answers aren’t set up yet. The common-question answers still work.' : 'Couldn’t get an answer. Check your connection and try again.'});
  }
  renderAsk();
}
async function askReport(i, reason){
  const m=state.ask[i]; if(!m) return;
  try{
    if(typeof sb!=='undefined' && sb && typeof session!=='undefined' && session) await sb.from('ask_reports').insert({question:m.q, answer:m.text, reason, baby_id:(typeof baby!=='undefined'&&baby)?baby.id:null});
    else if(window.claude?.use){ const d=await window.claude.use('db'); if(d) await d.collection('ask_reports').add({question:m.q,answer:m.text,reason,at:Date.now()}); }
  }catch(e){}
  m.reporting=false; m.reported=true; renderAsk(); toast('Thanks. We’ll review this answer.');
}

function chime(){ try{ navigator.vibrate?.([250,120,250,120,400]); }catch(e){}
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime; [0,0.28,0.56].forEach((d,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=[660,880,990][i]; g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.25,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.45); o.connect(g); g.connect(audioCtx.destination); o.start(t+d); o.stop(t+d+0.5); }); }catch(e){} }

/* ---------- keep the screen on while a timer runs ---------- */
let wakeLock=null;
async function syncWakeLock(){
  const want = prefs.keepAwake!==false && state.entries.some(e=>(e.end==null&&(e.type==='breast'||e.type==='sleep'))||(e.type==='activity'&&e.end===null));
  const ka=(typeof NATIVE!=='undefined'&&NATIVE&&typeof capPlugin==='function')?capPlugin('KeepAwake'):null;
  if(ka){ try{ want?await ka.keepAwake():await ka.allowSleep(); }catch(e){} return; }
  try{
    if(want && !wakeLock && 'wakeLock' in navigator && document.visibilityState==='visible'){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }
    else if(!want && wakeLock){ const w=wakeLock; wakeLock=null; await w.release(); }
  }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncWakeLock(); });

function prepText(appt){
  const now=Date.now(), p=state.profile||{}, es=state.entries.filter(e=>!isFuture(e,now)), L=[];
  L.push(`${p.name||'Baby'} · ${ageText(p.birth)} old${appt?` · visit ${fmtDate(appt.start)} ${fmtTime(appt.start)}${appt.title?' ('+appt.title+')':''}`:''}`);
  L.push('','Last 7 days:');
  for(let i=6;i>=0;i--){ const d=dayAdd(startOfDay(now),-i); if(!es.some(e=>e.start>=d&&e.start<dayAdd(d,1))) continue; const s=daySummary(d);
    L.push(`${i===0?'Today':fmtDate(d)}: ${s.feeds} feeds${s.bottleMl?', '+U.vol(s.bottleMl)+' by bottle':''}${s.breastMs?', '+fmtDur(s.breastMs)+' nursing':''} · ${s.wet} wet, ${s.dirty} dirty${s.spit?' · '+s.spit+(s.spit===1?' spit-up':' spit-ups'):''}`); }
  const feeds=es.filter(e=>(e.type==='breast'||e.type==='bottle')&&e.start>now-36*HR).map(e=>e.start).sort((a,b)=>a-b);
  let gap=0; for(let i=1;i<feeds.length;i++) if(feeds[i]>now-DAY) gap=Math.max(gap,feeds[i]-feeds[i-1]);
  if(gap) L.push(`Longest stretch between feeds (last 24h): ${fmtDur(gap)}`);
  const g=es.find(e=>e.type==='growth'); if(g) L.push(`Latest measurement (${fmtDate(g.start)}): ${entrySummary(g)}`);
  const notes=es.filter(e=>e.start>now-14*DAY && (['temp','med','symptom','spit'].includes(e.type)&&(e.type!=='spit'||spitWarn(e)) || (e.type==='diaper'&&(e.rash||['red','black','white'].includes(e.pcolor)))));
  if(notes.length){ L.push('','Health notes (last 2 weeks):'); notes.slice(0,12).forEach(e=>L.push(`- ${fmtDate(e.start)} ${fmtTime(e.start)}: ${T[e.type].label}: ${entrySummary(e)}${e.note?' ('+e.note+')':''}`)); }
  const mo=msOpen(); if(mo.open.length){ L.push('',`Milestones not checked yet (by ${mo.sel===12?'1 year':mo.sel+' months'}):`); mo.open.forEach(x=>L.push('- '+x)); }
  L.push('','Questions to ask:','- ','- ');
  return L.join('\n');
}

/* ---------- coming up ---------- */
// Well-child visits from the AAP Bright Futures schedule: [months after birth (or days if 'd'), label]
const CHECKUPS=[[4,'Newborn checkup (3–5 days)','d'],[14,'2-week checkup','d'],[1,'1-month checkup'],[2,'2-month checkup'],[4,'4-month checkup'],[6,'6-month checkup'],[9,'9-month checkup'],[12,'12-month checkup'],[15,'15-month checkup'],[18,'18-month checkup'],[24,'2-year checkup'],[30,'30-month checkup'],[36,'3-year checkup']];
function addMonths(birth, m){ const d=new Date(birth+'T09:00'); d.setMonth(d.getMonth()+m); return d.getTime(); }
function relDays(t, now){
  const d=Math.round((startOfDay(t)-startOfDay(now))/DAY);
  if(d===0) return 'today'; if(d===1) return 'tomorrow'; if(d===-1) return 'yesterday';
  if(d>0) return d>45 ? `in about ${Math.round(d/7)} weeks` : `in ${d} days`;
  return `${-d} days ago`;
}
function checkupPlan(p, now){
  if(!p?.birth) return [];
  const b0=new Date(p.birth+'T00:00').getTime(), docs=state.entries.filter(e=>e.type==='doctor'), used=new Set();
  // Each visit counts for the checkup whose due date (from the date of birth) is closest:
  // the window runs halfway to the previous checkup and halfway to the next one.
  const dues=CHECKUPS.map(([n,,unit])=>unit==='d' ? new Date(p.birth+'T09:00').getTime()+n*DAY : addMonths(p.birth,n));
  return CHECKUPS.map(([n,label],i)=>{
    const due=dues[i], from=i?Math.max((dues[i-1]+due)/2, due-30*DAY):b0, to=i<dues.length-1?Math.min((due+dues[i+1])/2, due+45*DAY):due+60*DAY;
    const v=docs.filter(e=>!used.has(e.id)&&e.start>=from&&e.start<to).sort((a,c)=>Math.abs(a.start-due)-Math.abs(c.start-due))[0];
    if(v) used.add(v.id);
    return {label, due, v, done: !!v && v.start<=now};
  });
}
function nextCheckup(p, now){
  const r=checkupPlan(p, now).find(x=>!x.v && x.due>=now-7*DAY);
  return r ? {label:r.label, due:r.due} : null;
}
function feedEstimate(now){
  if(state.entries.some(e=>e.type==='breast' && e.end==null)) return null;
  const feeds=state.entries.filter(e=>(e.type==='breast'||e.type==='bottle') && e.start<=now && e.start>now-3*DAY).map(e=>e.start).sort((a,b)=>a-b);
  if(feeds.length<4) return null;
  const gaps=[]; for(let i=1;i<feeds.length;i++){ const g=feeds[i]-feeds[i-1]; if(g>=30*MIN && g<=8*HR) gaps.push(g); }
  if(gaps.length<3) return null;
  gaps.sort((a,b)=>a-b); const gap=gaps[Math.floor(gaps.length/2)];
  return {gap, next: feeds[feeds.length-1]+gap};
}
function nextTeeth(p, now){
  const months=(ageDays(p?.birth,now)??-1)/30.4375;
  if(months<3 || months>36) return null;
  const open=TEETH.filter(([id])=>!state.teeth[id+'_l'] || !state.teeth[id+'_r']).map(t=>({t,from:parseInt(t[4])})).sort((a,b)=>a.from-b.from);
  if(!open.length) return null;
  const {t}=open[0];
  return {label:`${t[2]==='u'?'Upper':'Lower'} ${t[1].toLowerCase()}s`, range:t[4]};
}
function tummyBlock(now, g, run){

  const dots = g.by==='sessions' ? `<div class="tdots" aria-hidden="true">${Array.from({length:Math.max(g.max,ss.length)},(_,i)=>`<i class="${i<ss.length?'on':''}${i>=g.min&&i>=ss.length?' opt':''}"></i>`).join('')}</div>` : tummyGoalLine(now).replace(/<span class="sub">.*<\/span>/,'');
  const list = ss.length ? `<div class="tlist">${ss.map(e=>`<button type="button" data-edit="${esc(e.id)}">${fmtTime(e.start)} · ${e.end===null?'now':(e.duration||0)+' min'}</button>`).join('')}</div>` : '';
  const start = run||!state.canWrite ? '' : `<div class="tstart"><span class="sub">Start a timer</span>${presetBtns('Tummy time','startTummy')}</div>`;
  return dots+list+start;
}
function comingUp(p, now){
  const items=[];
  const row=(c,icon,label,main,sub,extra='',attrs='')=>`<div class="cu" style="--c:${c}" ${attrs}><span class="ic ${IC()}">${svg(icon)}</span><div class="cx"><span class="label">${label}</span><b class="num">${main}</b>${sub?`<span class="sub">${sub}</span>`:''}${extra}</div></div>`;

function entriesOn(day){ const s=startOfDay(day), e=dayAdd(s,1); return state.entries.filter(x=>x.start>=s && x.start<e); }

  const s=startOfDay(day), e=dayAdd(s,1), now=Date.now(), L=e-s;
  return state.entries.filter(x=>x.type==='sleep' && (!kind || (x.kind||'nap')===kind)).reduce((acc,x)=>{
    const a=Math.max(s,x.start), b=Math.min(e, x.end??now); return acc + Math.max(0,b-a); },0);
}
function oddValue(type,d,id){
  const big=ml=>ml!=null && ml>300;

  if(type==='pump' && (big(d.left)||big(d.right))) return `${U.vol(Math.max(d.left||0,d.right||0))} from one side is more than usual.`;
  if(type==='vitals' && ((d.hr&&(d.hr<40||d.hr>250))||(d.rr&&d.rr>120)||(d.spo2&&(d.spo2<50||d.spo2>100))||(d.sys&&(d.sys<30||d.sys>150)))) return 'One of these numbers looks unusual. Check for a typo.';
  if(type==='temp' && d.value!=null && (d.value<34.5||d.value>42.5)) return `${U.tmp(d.value)} is outside the usual range for a body temperature.`;
  if(type==='growth'){
    const prev=state.entries.filter(e=>e.type==='growth' && e.id!==id && e.start<=d.start).sort((a,b)=>b.start-a.start);
    const pw=prev.find(e=>e.weight!=null), pl=prev.find(e=>e.length!=null);
    if(d.weight!=null && (d.weight<1||d.weight>25)) return `${U.wt(d.weight)} looks unusual for a baby’s weight.`;
    if(d.weight!=null && pw && Math.abs(d.weight-pw.weight)/pw.weight>0.25) return `${U.wt(d.weight)} is a big change from ${U.wt(pw.weight)} on ${fmtDate(pw.start)}.`;

    if(d.length!=null && pl && (d.length<pl.length-3 || d.length>pl.length*1.25)) return `${U.len(d.length)} is a big change from ${U.len(pl.length)} on ${fmtDate(pl.start)}.`;

}
function countFeeds(list){

}

    feeds:countFeeds(es),
    breastMs:es.filter(e=>e.type==='breast').reduce((a,e)=>a+breastTotals(e).total,0),

function weekly(now){

function rightNow(now){
  const p=state.profile||{}, age=ageDays(p.birth,now), wk=prefs.rnRange==='7d';

    const born=p.birth?startOfDay(new Date(p.birth+'T00:00').getTime()):0, first=startOfDay(state.entries.reduce((m,e)=>e.start<m?e.start:m,now));
    const t0=startOfDay(now); let a0=dayAdd(t0,-6); while(a0<Math.max(born,first) && a0<dayAdd(t0,-1)) a0=dayAdd(a0,1);
    const full=a0<t0, span=full?Math.round((t0-a0)/DAY):Math.max(1,(now-t0)/DAY), raw=full?rangeSummary(a0,t0):rangeSummary(t0,now), r1=v=>Math.round(v/span*10)/10;

    const pk=['wetOnly','dirtyOnly','mixed','dry'], ex=pk.map(k=>raw[k]/span), fl=ex.map(Math.floor); let left=r.diapers-fl.reduce((a,b)=>a+b,0);
    ex.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){ fl[i]++; left--; } }); pk.forEach((k,i)=>r[k]=fl[i]); ['bottleMl','breastMs','sleepMs'].forEach(k=>r[k]=raw[k]/span);
  }
  const ago=ms=>ms<MIN?'just now':fmtDur(ms)+' ago';

/* ---------- pumped milk stash (storage times: CDC / AAP guidance) ---------- */
const volRound = ml => U.imp() ? `${Math.round(ml/29.5735)} oz` : `${Math.round(ml/10)*10} ml`;
const STASH_LIFE={fridge:4*DAY, thawed:DAY, freezer:183*DAY};
function stashItems(now=Date.now()){
  return state.entries.filter(e=>e.type==='pump' && (e.store==='fridge'||e.store==='freezer') && !e.usedAt && !e.tossedAt && e.start<=now)
    .map(e=>{ const where=e.thawedAt?'thawed':e.store, from=e.thawedAt||e.start; return {e, ml:e.stashMl!=null?e.stashMl:(e.left||0)+(e.right||0), where, useBy:from+STASH_LIFE[where]}; }).filter(x=>x.ml>0)
    .sort((a,b)=>a.useBy-b.useBy);
}
async function takeFromStash(ml){
  let need=ml||0; const bags=stashItems().filter(x=>x.where!=='freezer' && x.useBy>Date.now());
  if(!bags.length) return;
  if(!need){ await safe(()=>store.update(bags[0].e.id,{usedAt:Date.now()})); return; }
  for(const b of bags){ if(need<=0) break;
    if(need>=b.ml-1){ need-=b.ml; await safe(()=>store.update(b.e.id,{usedAt:Date.now()})); }
    else { const left=b.ml-need; need=0; await safe(()=>store.update(b.e.id,{stashMl:left})); } }
}

function remindersPlan(now=Date.now()){

let remSig='', remTimers=[];
async function syncReminders(){
  const plan=remindersPlan(), sig=JSON.stringify(plan.map(x=>[x.id,x.at,x.body]));
  if(sig===remSig) return; remSig=sig;
  const ln=LN();
  if(ln){ try{ const pend=await ln.getPending(); if(pend?.notifications?.length) await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))}); if(plan.length) await ln.schedule({notifications:plan.map(x=>({id:x.id,title:x.title,body:x.body,schedule:{at:new Date(x.at),allowWhileIdle:true}}))}); }catch(e){} return; }
  remTimers.forEach(clearTimeout); remTimers=[];
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  plan.filter(x=>x.at-Date.now()<24*HR).forEach(x=>remTimers.push(setTimeout(async()=>{ try{ const reg=await navigator.serviceWorker?.getRegistration?.(); if(reg) reg.showNotification(x.title,{body:x.body,icon:'icons/icon-192.png',tag:'r'+x.id}); else new Notification(x.title,{body:x.body,tag:'r'+x.id}); }catch(e){} }, x.at-Date.now())));
}

function histAvg(t0){

  const core=x=>['breast','bottle','diaper','sleep'].includes(x.type), cnt=d=>state.entries.filter(x=>core(x)&&x.start>=d&&x.start<dayAdd(d,1)).length;
  const all=[]; for(let i=1;i<=7;i++){ const d=dayAdd(t0,-i); if(dayAdd(d,1)<=born) break; const c=cnt(d); if(c) all.push({d,c,s:daySummary(d)}); }
  const cs=all.map(x=>x.c).sort((a,b)=>a-b), med=cs.length?cs[Math.floor(cs.length/2)]:0;
  const isThin=d=>{ const c=cnt(d); return d<t0 && med>0 && all.length>=4 && c>0 && c<med*0.4; };

  // nursing
  if(S.some(s=>s.breastMs)) h+=card('Nursing', fmtDur(avgOf(use,'breastMs')), 'a day', pill('breastMs',10*MIN,fmtDur), tChart(S,[{name:'Nursing',color:'color-mix(in srgb,var(--feed) 60%,var(--surface))',vals:S.map(s=>s.breastMs/HR)}],avgOf(use,'breastMs')/HR,(v,ax)=>ax?(Math.round(v*10)/10)+'h':fmtDur(v*HR)));

    tChart(S,[{name:'Wet',color:'var(--diaper)',vals:S.map(s=>s.wetOnly)},{name:'Both',color:'url(#bothp)',vals:S.map(s=>s.mixed)},{name:'Dirty',color:'var(--poo)',vals:S.map(s=>s.dirtyOnly)},{name:'Dry',color:'var(--ink-3)',vals:S.map(s=>s.dry)}].filter(x=>x.vals.some(v=>v)),avgOf(use,'diapers'),v=>String(Math.round(v)),true), dl);
  // pumped
  if(S.some(s=>s.pumpMl)) h+=card('Pumped', U.vol(avgOf(use,'pumpMl')), 'a day', pill('pumpMl',15,v=>U.vol(v)), tChart(S,[{name:'Pumped',color:'var(--activity)',vals:S.map(s=>toU(s.pumpMl))}],toU(avgOf(use,'pumpMl')),fU));
  // sleep only when logged on most days
  const sd=use.filter(s=>s.sleepMs>0).length;
  if(sd>=Math.ceil(use.length*0.6)) h+=card('Sleep', fmtDur(avgOf(use,'sleepMs')), 'a day', pill('sleepMs',15*MIN,fmtDur), tChart(S,[{name:'Night',color:'var(--sleep)',vals:S.map(s=>s.nightMs/HR)},{name:'Naps',color:'color-mix(in srgb,var(--sleep) 50%,var(--surface))',vals:S.map(s=>s.napMs/HR)}],avgOf(use,'sleepMs')/HR,(v,ax)=>ax?Math.round(v)+'h':fmtDur(v*HR)), `<div class="legend" style="margin:2px 0 4px"><span><i style="background:var(--sleep)"></i>Night</span><span><i style="background:color-mix(in srgb,var(--sleep) 50%,var(--surface))"></i>Naps</span></div>`);
  h+=`</div>`;
  h+=`<p class="note" style="margin:4px 2px 16px">Dashed line: average of full days. Today is faded until the day is over.${prev?` Arrows compare with the ${vsTxt}.`:''}${sd&&sd<Math.ceil(use.length*0.6)?' Sleep appears here once it’s logged on most days.':''}</p>`;
  h+=typicalDay();
  return h;
}

const WHO={
